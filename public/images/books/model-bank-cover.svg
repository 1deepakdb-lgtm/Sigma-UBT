<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="100%" height="100%">
  <defs>
    <!-- Cool Midnight Slate Navy Gradient -->
    <linearGradient id="modelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Radiant Top Flare -->
    <radialGradient id="modelTopFlare" cx="75%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Cool Bottom Glow -->
    <radialGradient id="modelBottomFlare" cx="25%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Spine 3D Shading -->
    <linearGradient id="modelSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Sparkling Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Center Emblem Container Gradient -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.45" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="diagonalGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c4a6e" flood-opacity="0.4" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="400" height="540" rx="16" fill="url(#modelBg)" />
  <!-- Radiant Top Light -->
  <rect x="0" y="0" width="400" height="540" rx="16" fill="url(#modelTopFlare)" />
  <!-- Bottom Crimson Ambient Glow -->
  <rect x="0" y="0" width="400" height="540" rx="16" fill="url(#modelBottomFlare)" />

  <!-- Diagonal Gloss Sheen -->
  <path d="M 0 0 L 260 0 L 0 380 Z" fill="url(#diagonalGloss)" />

  <!-- Traditional Korean Geometry Watermarks -->
  <circle cx="214" cy="265" r="155" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="28" />
  <circle cx="214" cy="265" r="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="214" cy="265" r="65" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Book Spine 3D Effect -->
  <rect x="0" y="0" width="28" height="540" rx="16" fill="url(#modelSpine)" />
  <line x1="28" y1="0" x2="28" y2="540" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  <line x1="26" y1="0" x2="26" y2="540" stroke="rgba(0,0,0,0.35)" stroke-width="1" />

  <!-- Inner Double Border Frame -->
  <rect x="42" y="16" width="342" height="508" rx="12" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" />
  <rect x="46" y="20" width="334" height="500" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.85" />



  <!-- CENTER EMBLEM CONTAINER -->
  <rect x="150" y="94" width="128" height="118" rx="22" fill="url(#emblemBg)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="154" y="98" width="120" height="110" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.75" />

  <!-- Model Bank Icon Graphic: Modern Computer with UBT Exam Screen, Timer & Pass Badge -->
  <g transform="translate(182, 114)">
    <!-- Glow behind monitor -->
    <circle cx="32" cy="40" r="30" fill="#fde047" fill-opacity="0.25" />

    <!-- Monitor Frame -->
    <rect x="4" y="10" width="56" height="42" rx="5" fill="#ffffff" filter="url(#cardShadow)" />
    <!-- Screen Display -->
    <rect x="8" y="14" width="48" height="34" rx="3" fill="#0f172a" />
    <!-- Header bar on screen -->
    <rect x="8" y="14" width="48" height="8" fill="#2563eb" />
    <circle cx="13" cy="18" r="1.5" fill="#ffffff" />
    <circle cx="18" cy="18" r="1.5" fill="#f59e0b" />
    <!-- "UBT" Text on Screen -->
    <text x="32" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#38bdf8" letter-spacing="1.5">UBT</text>

    <!-- Monitor Stand -->
    <path d="M 28 52 L 26 62 L 38 62 L 36 52 Z" fill="#e2e8f0" />
    <rect x="20" y="62" width="24" height="4" rx="2" fill="#cbd5e1" />

    <!-- Green Success Badge -->
    <g transform="translate(48, 8)">
      <circle cx="0" cy="0" r="8" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" />
      <path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Stopwatch Badge -->
    <g transform="translate(12, 10)">
      <circle cx="0" cy="0" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2" />
      <line x1="0" y1="0" x2="0" y2="-3" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
      <line x1="0" y1="0" x2="2" y2="0" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- KOREAN SUBTITLE -->
  <g transform="translate(214, 240)">
    <rect x="-70" y="-14" width="140" height="24" rx="12" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" />
    <text text-anchor="middle" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" fill="#fef08a">실전 모의고사 문제집</text>
  </g>

  <!-- MAIN ENGLISH TITLE -->
  <text x="214" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5" fill="#ffffff" filter="url(#textGlow)">MODEL QUESTION</text>
  <text x="214" y="302" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1.5" fill="#ffffff" filter="url(#textGlow)">BANK</text>



  <!-- VIBRANT BADGE PILL -->
  <g transform="translate(214, 354)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="url(#pillGrad)" stroke="#ffffff" stroke-width="1.8" filter="url(#cardShadow)" />
    <!-- White inner gloss -->
    <path d="M -75 -12 Q 0 -6 75 -12" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="1.2" fill="#ffffff">★ 6 FULL SETS ★</text>
  </g>

  <!-- FEATURE TAGS -->
  <g transform="translate(56, 394)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="94" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="12" cy="13" r="3.5" fill="#fde047" />
    <text x="54" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">Reading 20 Qs</text>

    <!-- Tag 2 -->
    <rect x="102" y="0" width="94" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="114" cy="13" r="3.5" fill="#38bdf8" />
    <text x="156" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">Listening 20 Qs</text>

    <!-- Tag 3 -->
    <rect x="204" y="0" width="94" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="216" cy="13" r="3.5" fill="#38bdf8" />
    <text x="258" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">50 Min Time</text>
  </g>

  <!-- FOOTER DIVIDER -->
  <line x1="60" y1="440" x2="368" y2="440" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- FOOTER -->
  <text x="214" y="464" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="2" fill="url(#goldGrad)">SIGMA EDUCATION</text>
  <text x="214" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8" fill="#e0f2fe">KBC PVT. LTD. • EPS UBT SIMULATION</text>

  <!-- Authentic ISBN Barcode Lines -->
  <g transform="translate(150, 494)" fill="#ffffff" fill-opacity="0.9">
    <rect x="0" y="0" width="2" height="15" />
    <rect x="4" y="0" width="1" height="15" />
    <rect x="7" y="0" width="3" height="15" />
    <rect x="12" y="0" width="1" height="15" />
    <rect x="15" y="0" width="2" height="15" />
    <rect x="19" y="0" width="4" height="15" />
    <rect x="25" y="0" width="1" height="15" />
    <rect x="28" y="0" width="3" height="15" />
    <rect x="33" y="0" width="2" height="15" />
    <rect x="37" y="0" width="1" height="15" />
    <rect x="40" y="0" width="3" height="15" />
    <rect x="45" y="0" width="1" height="15" />
    <rect x="48" y="0" width="2" height="15" />
    <rect x="52" y="0" width="4" height="15" />
    <rect x="58" y="0" width="2" height="15" />
    <rect x="62" y="0" width="1" height="15" />
    <rect x="65" y="0" width="3" height="15" />
    <rect x="70" y="0" width="1" height="15" />
    <rect x="73" y="0" width="3" height="15" />
    <rect x="78" y="0" width="2" height="15" />
    <rect x="82" y="0" width="1" height="15" />
    <rect x="85" y="0" width="2" height="15" />
    <rect x="89" y="0" width="3" height="15" />
    <rect x="94" y="0" width="2" height="15" />
    <rect x="98" y="0" width="4" height="15" />
    <rect x="104" y="0" width="2" height="15" />
  </g>
</svg>
