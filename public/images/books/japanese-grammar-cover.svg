<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="100%" height="100%">
  <defs>
    <!-- Cool Oceanic Slate Navy Gradient -->
    <linearGradient id="grammarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Radiant Top Flare -->
    <radialGradient id="topFlare" cx="75%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0a1128" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Bottom Glow -->
    <radialGradient id="bottomFlare" cx="25%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a1128" stop-opacity="0" />
    </radialGradient>

    <!-- Spine 3D Shading -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1128" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Sparkling Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Center Emblem Container Gradient -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.45" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="diagonalGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c4a6e" flood-opacity="0.4" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="400" height="540" rx="16" fill="url(#grammarBg)" />
  <!-- Radiant Top Light -->
  <rect x="0" y="0" width="400" height="540" rx="16" fill="url(#topFlare)" />
  <!-- Bottom Golden Ambient Glow -->
  <rect x="0" y="0" width="400" height="540" rx="16" fill="url(#bottomFlare)" />

  <!-- Diagonal Gloss Sheen -->
  <path d="M 0 0 L 260 0 L 0 380 Z" fill="url(#diagonalGloss)" />

  <!-- Traditional Pattern Watermarks -->
  <circle cx="214" cy="265" r="155" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="28" />
  <circle cx="214" cy="265" r="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="214" cy="265" r="65" fill="none" stroke="rgba(251,191,36,0.2)" stroke-width="1" />

  <!-- Book Spine 3D Effect -->
  <rect x="0" y="0" width="28" height="540" rx="16" fill="url(#spineGrad)" />
  <line x1="28" y1="0" x2="28" y2="540" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  <line x1="26" y1="0" x2="26" y2="540" stroke="rgba(0,0,0,0.35)" stroke-width="1" />

  <!-- Inner Double Border Frame -->
  <rect x="42" y="16" width="342" height="508" rx="12" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" />
  <rect x="46" y="20" width="334" height="500" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.85" />



  <!-- CENTER EMBLEM CONTAINER -->
  <rect x="150" y="94" width="128" height="118" rx="22" fill="url(#emblemBg)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="154" y="98" width="120" height="110" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.75" />

  <!-- Japanese Kana & Audio Emblem: 'あ' / 'ア' with Soundwaves -->
  <g transform="translate(182, 114)">
    <!-- Open Book Base -->
    <path d="M 6 50 Q 32 42 32 20 Q 32 42 58 50 L 58 66 Q 32 58 32 38 Q 32 58 6 66 Z" fill="#ffffff" filter="url(#cardShadow)" />
    <line x1="32" y1="20" x2="32" y2="66" stroke="#c084fc" stroke-width="1.8" />

    <!-- Hiragana 'あ' -->
    <text x="18" y="44" font-family="'Noto Sans JP', system-ui" font-size="16" font-weight="900" fill="#2563eb">あ</text>
    <!-- Katakana 'ア' -->
    <text x="36" y="44" font-family="'Noto Sans JP', system-ui" font-size="16" font-weight="900" fill="#e11d48">ア</text>

    <!-- Audio Broadcast Wave -->
    <path d="M 14 12 Q 32 4 50 12" fill="none" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="32" cy="14" r="3.5" fill="#f43f5e" />
  </g>

  <!-- JAPANESE SUBTITLE -->
  <g transform="translate(214, 240)">
    <rect x="-65" y="-14" width="130" height="24" rx="12" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" />
    <text text-anchor="middle" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" fill="#fef08a">日本語文法と発音</text>
  </g>

  <!-- MAIN ENGLISH TITLE -->
  <text x="214" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="0.5" fill="#ffffff" filter="url(#textGlow)">JAPANESE GRAMMAR</text>
  <text x="214" y="302" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" fill="#ffffff" filter="url(#textGlow)">&amp; AUDIO GUIDE</text>

  <!-- SUBTITLE DESCRIPTION -->
  <text x="214" y="324" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#e0f2fe">Essential Patterns &amp; Voice Guide</text>

  <!-- VIBRANT BADGE PILL -->
  <g transform="translate(214, 354)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="url(#pillGrad)" stroke="#ffffff" stroke-width="1.8" filter="url(#cardShadow)" />
    <!-- White inner gloss -->
    <path d="M -75 -12 Q 0 -6 75 -12" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" letter-spacing="1.2" fill="#ffffff">★ GRAMMAR &amp; AUDIO ★</text>
  </g>

  <!-- FEATURE TAGS -->
  <g transform="translate(56, 394)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="94" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="12" cy="13" r="3.5" fill="#fde047" />
    <text x="54" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">Key Patterns</text>

    <!-- Tag 2 -->
    <rect x="102" y="0" width="94" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="114" cy="13" r="3.5" fill="#38bdf8" />
    <text x="156" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">Particles (助詞)</text>

    <!-- Tag 3 -->
    <rect x="204" y="0" width="94" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="216" cy="13" r="3.5" fill="#38bdf8" />
    <text x="258" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">Voice Models</text>
  </g>

  <!-- FOOTER DIVIDER -->
  <line x1="60" y1="440" x2="368" y2="440" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- FOOTER -->
  <text x="214" y="464" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="2" fill="url(#goldGrad)">SIGMA EDUCATION</text>
  <text x="214" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8" fill="#e0f2fe">KBC PVT. LTD. • JAPANESE PHONETICS STANDARD</text>

  <!-- Authentic ISBN Barcode Lines -->
  <g transform="translate(150, 494)" fill="#ffffff" fill-opacity="0.9">
    <rect x="0" y="0" width="2" height="15" />
    <rect x="4" y="0" width="1" height="15" />
    <rect x="7" y="0" width="3" height="15" />
    <rect x="12" y="0" width="1" height="15" />
    <rect x="15" y="0" width="2" height="15" />
    <rect x="19" y="0" width="4" height="15" />
    <rect x="25" y="0" width="1" height="15" />
    <rect x="28" y="0" width="3" height="15" />
    <rect x="33" y="0" width="2" height="15" />
    <rect x="37" y="0" width="1" height="15" />
    <rect x="40" y="0" width="3" height="15" />
    <rect x="45" y="0" width="1" height="15" />
    <rect x="48" y="0" width="2" height="15" />
    <rect x="52" y="0" width="4" height="15" />
    <rect x="58" y="0" width="2" height="15" />
    <rect x="62" y="0" width="1" height="15" />
    <rect x="65" y="0" width="3" height="15" />
    <rect x="70" y="0" width="1" height="15" />
    <rect x="73" y="0" width="3" height="15" />
    <rect x="78" y="0" width="2" height="15" />
    <rect x="82" y="0" width="1" height="15" />
    <rect x="85" y="0" width="2" height="15" />
    <rect x="89" y="0" width="3" height="15" />
    <rect x="94" y="0" width="2" height="15" />
    <rect x="98" y="0" width="4" height="15" />
    <rect x="104" y="0" width="2" height="15" />
  </g>
</svg>
