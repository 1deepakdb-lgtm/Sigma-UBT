<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes">
<title>Document Viewer</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    color: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-x pan-y pinch-zoom;
    -webkit-text-size-adjust: 100%;
  }
  #viewer-scroll-container {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: auto;
    background-color: #f1f5f9;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y pinch-zoom;
    position: relative;
  }
  #viewer-zoom-layer {
    min-width: 100%;
    width: max-content;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: 0 0;
    transition: transform 0.08s ease-out;
    margin: 0 auto;
  }
  .pdf-page-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 0;
    background-color: transparent;
    box-sizing: border-box;
  }
  @media (min-width: 768px) {
    .pdf-page-wrapper {
      padding: 10px 0;
    }
  }
  canvas {
    display: block;
    background-color: #ffffff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    margin: 0 auto;
  }
  #loading-view {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background-color: #ffffff;
    z-index: 100;
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 3.5px solid rgba(0, 0, 0, 0.1);
    border-top-color: #1e3a8a;
    border-radius: 50%;
    animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 14px;
    font-weight: 700;
    color: #1e3a8a;
    letter-spacing: 0.3px;
    text-align: center;
    padding: 0 20px;
  }
  .loading-badge {
    font-size: 11px;
    font-weight: 800;
    color: #15803d;
    background-color: #dcfce7;
    border: 1px solid #bbf7d0;
    padding: 3px 10px;
    border-radius: 12px;
    display: none;
  }
  #error-view {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
    background-color: #0f172a;
    z-index: 100;
  }
  .error-title {
    font-size: 16px;
    font-weight: 700;
    color: #f87171;
  }
  .error-desc {
    font-size: 13px;
    color: #94a3b8;
    max-width: 400px;
    line-height: 1.5;
  }
  .retry-btn {
    margin-top: 8px;
    background-color: #38bdf8;
    color: #0f172a;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="loading-view">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-progress">Opening Document...</div>
  <div class="loading-badge" id="offline-badge">⚡ Stored Offline</div>
</div>

<div id="error-view">
  <div class="error-title">Unable to load document</div>
  <div class="error-desc" id="error-message">The requested PDF could not be displayed.</div>
  <button class="retry-btn" onclick="location.reload()">Retry</button>
</div>

<div id="viewer-scroll-container">
  <div id="viewer-zoom-layer"></div>
</div>

<script src="/pdf.worker.min.js"></script>
<script src="/pdf.min.js"></script>
<script>
  // Strictly prevent right-click context menu (no save/download popup)
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  // Disable common keyboard shortcuts for save / print
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'u')) {
      e.preventDefault();
    }
  });

  (function() {
    function sanitizeUrl(u) {
      if (!u) return '';
      var clean = String(u).split('#')[0].trim();
      try {
        return encodeURI(decodeURI(clean));
      } catch (e) {
        return encodeURI(clean);
      }
    }

    function toAbsoluteUrl(u) {
      if (!u) return '';
      var clean = sanitizeUrl(u);
      if (/^https?:\/\//i.test(clean) || clean.startsWith('blob:') || clean.startsWith('data:')) {
        return clean;
      }
      var origin = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
      if (!origin || origin.indexOf('http') !== 0 || origin.includes('localhost') || origin.startsWith('file:') || origin.startsWith('capacitor:')) {
        origin = 'https://examjk.com';
      }
      return origin + (clean.startsWith('/') ? clean : '/' + clean);
    }

    var params = new URLSearchParams(window.location.search);
    var rawUrl = params.get('url');

    var loadingView = document.getElementById('loading-view');
    var loadingProgress = document.getElementById('loading-progress');
    var offlineBadge = document.getElementById('offline-badge');
    var errorView = document.getElementById('error-view');
    var errorMessage = document.getElementById('error-message');
    var container = document.getElementById('viewer-scroll-container');
    var zoomLayer = document.getElementById('viewer-zoom-layer');

    if (!rawUrl) {
      showError('No document URL specified.');
      return;
    }

    var cleanUrl = sanitizeUrl(rawUrl);
    var pdfDoc = null;
    var renderedPages = new Set();
    var renderingPages = new Set();
    var resizeTimer = null;

    if (typeof pdfjsLib === 'undefined') {
      showError('PDF viewer engine failed to initialize.');
      return;
    }

    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.js';
    } catch (e) {}

    function showError(msg) {
      if (loadingView) loadingView.style.display = 'none';
      if (errorView) {
        errorView.style.display = 'flex';
        if (errorMessage) errorMessage.textContent = msg || 'Failed to display document.';
      }
    }

    function readBlobAsArrayBuffer(blob) {
      if (!blob) return Promise.resolve(null);
      if (typeof blob.arrayBuffer === 'function') {
        return blob.arrayBuffer();
      }
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = function() { reject(reader.error || new Error('FileReader failed')); };
        reader.readAsArrayBuffer(blob);
      });
    }

    // =========================================================================
    // 1. LIFETIME OFFLINE STORAGE (Native IndexedDB + CacheStorage + RAM Cache)
    // =========================================================================
    var DB_NAME = 'sigma_eps_offline_db';
    var DB_VERSION = 1;
    var STORE_FILES = 'offline_files';
    var CACHE_NAME = 'sigma_pdf_cache_v1';

    // Request permanent persistence from browser so OS never auto-cleans storage
    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.persist) {
      try {
        navigator.storage.persist().catch(function() {});
      } catch (e) {}
    }

    function getUrlVariants(url) {
      if (!url) return [];
      var clean = String(url).split('#')[0].trim();
      var set = {};
      set[clean] = true;
      try {
        var dec = decodeURI(clean);
        set[dec] = true;
        set[encodeURI(dec)] = true;
        set[encodeURIComponent(dec)] = true;
        var decFull = decodeURIComponent(clean);
        set[decFull] = true;
        set[encodeURI(decFull)] = true;
      } catch (e) {}
      return Object.keys(set);
    }

    function openOfflineDb() {
      return new Promise(function(resolve) {
        if (!window.indexedDB) return resolve(null);
        try {
          var req = window.indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_FILES)) {
              db.createObjectStore(STORE_FILES, { keyPath: 'url' });
            }
          };
          req.onsuccess = function() { resolve(req.result); };
          req.onerror = function() { resolve(null); };
        } catch (e) {
          resolve(null);
        }
      });
    }

    function getFromDb(db, url) {
      return new Promise(function(resolve) {
        if (!db) return resolve(null);
        var variants = getUrlVariants(url);
        try {
          var tx = db.transaction(STORE_FILES, 'readonly');
          var store = tx.objectStore(STORE_FILES);
          var found = null;
          var count = 0;

          variants.forEach(function(v) {
            var req = store.get(v);
            req.onsuccess = function() {
              count++;
              if (!found && req.result && req.result.blob) {
                found = req.result.blob;
              }
              if (count === variants.length) resolve(found);
            };
            req.onerror = function() {
              count++;
              if (count === variants.length) resolve(found);
            };
          });
        } catch (e) {
          resolve(null);
        }
      });
    }

    function saveToDb(db, url, blob) {
      return new Promise(function(resolve) {
        if (!db || !blob) return resolve();
        var variants = getUrlVariants(url);
        try {
          var tx = db.transaction(STORE_FILES, 'readwrite');
          var store = tx.objectStore(STORE_FILES);
          variants.forEach(function(v) {
            store.put({
              url: v,
              blob: blob,
              size: blob.size,
              mimeType: blob.type || 'application/pdf',
              updatedAt: Date.now()
            });
          });
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { resolve(); };
        } catch (e) {
          resolve();
        }
      });
    }

    async function getFromCacheStorage(url) {
      if (typeof caches === 'undefined') return null;
      var variants = getUrlVariants(url);
      try {
        var cache = await caches.open(CACHE_NAME);
        for (var i = 0; i < variants.length; i++) {
          var matched = await cache.match(variants[i]);
          if (matched) {
            return await matched.blob();
          }
        }
      } catch (e) {}
      return null;
    }

    async function saveToCacheStorage(url, blob) {
      if (typeof caches === 'undefined' || !blob) return;
      var variants = getUrlVariants(url);
      try {
        var cache = await caches.open(CACHE_NAME);
        var resp = new Response(blob, {
          headers: {
            'Content-Type': 'application/pdf',
            'Content-Length': String(blob.size),
            'Cache-Control': 'public, max-age=31536000, immutable'
          }
        });
        variants.forEach(function(v) {
          cache.put(v, resp.clone()).catch(function() {});
        });
      } catch (e) {}
    }

    async function downloadPdfWithProgress(url, onProgress) {
      var fetchUrl = toAbsoluteUrl(url);

      // 1. Try modern fetch with direct arrayBuffer
      try {
        var resp = await fetch(fetchUrl);
        if (resp.ok) {
          if (onProgress) onProgress(100);
          var buf = await resp.arrayBuffer();
          if (buf && buf.byteLength > 1000) {
            return buf;
          }
        }
      } catch (fetchErr) {
        console.warn('Fetch download notice, trying XMLHttpRequest fallback:', fetchErr);
      }

      // 2. XMLHttpRequest fallback with arraybuffer (100% compatible with older Smart Boards & WebViews)
      return new Promise(function(resolve, reject) {
        function tryFetchUrl(targetUrl, onFail) {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', targetUrl, true);
          xhr.responseType = 'arraybuffer';
          xhr.onprogress = function(e) {
            if (e.lengthComputable && e.total > 0 && onProgress) {
              var pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
              onProgress(pct);
            }
          };
          xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
              if (onProgress) onProgress(100);
              resolve(xhr.response);
            } else if (onFail) {
              onFail();
            } else {
              reject(new Error('HTTP status ' + xhr.status));
            }
          };
          xhr.onerror = function() {
            if (onFail) {
              onFail();
            } else {
              reject(new Error('Network connection error while fetching PDF.'));
            }
          };
          xhr.send();
        }

        tryFetchUrl(fetchUrl, function() {
          if (!fetchUrl.startsWith('https://examjk.com')) {
            var directFallback = 'https://examjk.com' + (url.startsWith('/') ? url : '/' + url);
            tryFetchUrl(directFallback, null);
          } else {
            reject(new Error('Network connection error while fetching PDF.'));
          }
        });
      });
    }

    async function loadPdfDataForLifetime(url) {
      var validUrl = sanitizeUrl(url);
      var variants = getUrlVariants(validUrl);
      if (validUrl !== url) {
        var origVariants = getUrlVariants(url);
        for (var ov = 0; ov < origVariants.length; ov++) {
          if (variants.indexOf(origVariants[ov]) === -1) variants.push(origVariants[ov]);
        }
      }

      // 0. Priority 0: Instant RAM in-memory cache check (0ms latency!)
      try {
        var ramCache = (window.parent && window.parent !== window && window.parent.__SIGMA_BUFFER_CACHE__)
          ? window.parent.__SIGMA_BUFFER_CACHE__ : (window.__SIGMA_BUFFER_CACHE__ || null);
        if (ramCache) {
          for (var r = 0; r < variants.length; r++) {
            if (ramCache.has(variants[r])) {
              var mBuf = ramCache.get(variants[r]);
              if (mBuf && (mBuf.byteLength > 1000 || (mBuf.buffer && mBuf.buffer.byteLength > 1000))) {
                if (loadingView) loadingView.style.display = 'none';
                if (offlineBadge) offlineBadge.style.display = 'inline-block';
                return mBuf.slice ? mBuf.slice(0) : mBuf;
              }
            }
          }
        }
      } catch (e) {}

      // 0b. If directly passed a local blob: URL
      if (url.startsWith('blob:') || validUrl.startsWith('blob:')) {
        try {
          var blobResp = await fetch(validUrl);
          var blobObj = await blobResp.blob();
          if (loadingView) loadingView.style.display = 'none';
          return await readBlobAsArrayBuffer(blobObj);
        } catch (e) {}
      }

      var db = await openOfflineDb();

      // Step 1: Check persistent IndexedDB
      var blob = await getFromDb(db, validUrl);
      if (!blob && validUrl !== url) {
        blob = await getFromDb(db, url);
      }

      // Step 2: Check persistent CacheStorage
      if (!blob) {
        blob = await getFromCacheStorage(validUrl);
      }
      if (!blob && validUrl !== url) {
        blob = await getFromCacheStorage(url);
      }

      if (blob) {
        // Instant 0ms cached display from persistent disk storage!
        if (loadingView) loadingView.style.display = 'none';
        if (offlineBadge) offlineBadge.style.display = 'inline-block';
        var cachedArrBuf = await readBlobAsArrayBuffer(blob);
        // Seed RAM cache for future 0ms instant opens
        try {
          var pCache = (window.parent && window.parent !== window && window.parent.__SIGMA_BUFFER_CACHE__)
            ? window.parent.__SIGMA_BUFFER_CACHE__ : (window.__SIGMA_BUFFER_CACHE__ || null);
          if (pCache && cachedArrBuf) {
            variants.forEach(function(v) { pCache.set(v, cachedArrBuf); });
          }
        } catch (e) {}
        return cachedArrBuf;
      }

      // Step 3: Fetch over network with progress bar and store permanently for lifetime
      if (loadingProgress) loadingProgress.textContent = 'Opening Document... 0%';
      var downloadedArrayBuffer = await downloadPdfWithProgress(validUrl, function(pct) {
        if (loadingProgress) loadingProgress.textContent = 'Opening Document... ' + pct + '%';
      });

      // Save to IndexedDB & CacheStorage in background for lifetime offline access
      try {
        var pdfBlob = new Blob([downloadedArrayBuffer], { type: 'application/pdf' });
        saveToDb(db, validUrl, pdfBlob);
        saveToCacheStorage(validUrl, pdfBlob);
        var pCache2 = (window.parent && window.parent !== window && window.parent.__SIGMA_BUFFER_CACHE__)
          ? window.parent.__SIGMA_BUFFER_CACHE__ : (window.__SIGMA_BUFFER_CACHE__ || null);
        if (pCache2) {
          variants.forEach(function(v) { pCache2.set(v, downloadedArrayBuffer); });
        }
      } catch (e) {}

      return downloadedArrayBuffer;
    }

    // =========================================================================
    // 2. DOCUMENT RENDERING ENGINE (225% ZOOM SCREEN FIT & REAL ULTRA HD)
    // =========================================================================
    function getTargetDimensions(baseViewport) {
      var screenWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 1920;
      var screenHeight = window.innerHeight || document.documentElement.clientHeight || 1080;

      var pageW = (baseViewport && baseViewport.width) ? baseViewport.width : 595.28;
      var pageH = (baseViewport && baseViewport.height) ? baseViewport.height : 841.89;
      var pageAspect = pageH / pageW; // Standard ~1.414 for A4 textbooks

      // 1. Landscape Displays (Smart Boards, Large Monitors, Laptops, TV):
      // 225% ZOOM OUTPUT FIT ON SCREEN:
      // Base height-fit on 1080p is ~750px. 225% zoom expands to 2.25x (~1685px),
      // filling 88-94% of the wide screen with large, bold, crystal clear Korean text and diagrams!
      if (screenWidth >= screenHeight) {
        var verticalMargin = screenHeight >= 1080 ? 20 : 12;
        var maxH = Math.max(400, screenHeight - verticalMargin);
        var baseFitHWidth = Math.floor(maxH / pageAspect);

        // 225% Zoom: 2.25x scale of standard height-fit width
        var zoom225Width = Math.floor(baseFitHWidth * 2.25);
        var optimalW = Math.min(zoom225Width, Math.floor(screenWidth * 0.94));
        optimalW = Math.max(optimalW, Math.min(screenWidth - 16, Math.floor(screenWidth * 0.88)));
        return { width: optimalW, height: Math.floor(optimalW * pageAspect) };
      }

      // 2. Portrait Displays (All Mobile Apps, Android APK, iOS, Portrait Tablets):
      // APPLY EXACT SAME 225% ZOOM OUTPUT CONDITION ACROSS ALL APPS:
      // Base portrait width * 2.25x yields large, bold, pin-sharp text matching Smart Board clarity
      var zoom225Portrait = Math.round(screenWidth * 2.25);
      // Ensure at least 225% of standard A4 point width (595.28 * 2.25 = 1339px)
      var standardA4_225 = Math.round(pageW * 2.25);
      var optimalPortraitW = Math.max(zoom225Portrait, Math.min(standardA4_225, Math.round(screenWidth * 2.25)));
      return { width: optimalPortraitW, height: Math.floor(optimalPortraitW * pageAspect) };
    }

    function getTargetWidth(baseViewport) {
      return getTargetDimensions(baseViewport).width;
    }

    async function renderPage(pageNum, wrapper, targetWidth) {
      if (renderingPages.has(pageNum)) return;
      renderingPages.add(pageNum);

      try {
        var page = await pdfDoc.getPage(pageNum);
        var baseViewport = page.getViewport({ scale: 1.0 });
        var dims = getTargetDimensions(baseViewport);
        var displayWidth = Math.round(targetWidth || dims.width);
        var pageAspect = baseViewport.height / baseViewport.width;
        var displayHeight = Math.round(displayWidth * pageAspect);

        var dpr = window.devicePixelRatio || 1;
        // ULTRA HD VECTOR CLARITY (100% MATCH REAL R2 FILE):
        // Backing store supersampled at high-density for pin-sharp subpixel vector curves & print intent
        var targetBackingScale = Math.min(Math.max(dpr, 1.8), 2.5);
        var maxBackingDim = 3840; // GPU safe texture limit for Smart Boards & 4K displays

        var desiredBackingWidth = Math.round(displayWidth * targetBackingScale);
        var desiredBackingHeight = Math.round(displayHeight * targetBackingScale);

        var backingScale = targetBackingScale;
        if (desiredBackingWidth > maxBackingDim || desiredBackingHeight > maxBackingDim) {
          var downFactor = Math.min(maxBackingDim / desiredBackingWidth, maxBackingDim / desiredBackingHeight);
          backingScale = targetBackingScale * downFactor;
        }

        var backingWidth = Math.round(displayWidth * backingScale);
        var backingHeight = Math.round(displayHeight * backingScale);

        var canvas = document.createElement('canvas');
        canvas.width = backingWidth;
        canvas.height = backingHeight;

        // Set CSS display width and height in EXACT natural page aspect ratio:
        canvas.style.width = displayWidth + 'px';
        canvas.style.height = displayHeight + 'px';
        canvas.style.aspectRatio = (baseViewport.width + ' / ' + baseViewport.height);
        canvas.style.display = 'block';
        canvas.style.margin = '0 auto';
        canvas.style.backgroundColor = '#ffffff';

        // alpha: false enables subpixel font antialiasing (no fuzzy/broken text)
        var ctx = canvas.getContext('2d', { alpha: false });
        if (ctx) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, backingWidth, backingHeight);
          ctx.imageSmoothingEnabled = true;
          if ('imageSmoothingQuality' in ctx) {
            ctx.imageSmoothingQuality = 'high';
          }
        }

        var baseScale = displayWidth / baseViewport.width;
        var viewport = page.getViewport({ scale: baseScale });
        var transform = backingScale !== 1 ? [backingScale, 0, 0, backingScale, 0, 0] : null;

        // intent: 'print' forces PDF.js to NOT downsample images and render vector paths at full 100% quality
        await page.render({
          canvasContext: ctx,
          transform: transform,
          viewport: viewport,
          intent: 'print'
        }).promise;

        wrapper.innerHTML = '';
        wrapper.style.minHeight = displayHeight + 'px';
        wrapper.appendChild(canvas);

        renderedPages.add(pageNum);
      } catch (err) {
        console.warn('Page ' + pageNum + ' high-res render warning, executing fallback:', err);
        try {
          var fbPage = await pdfDoc.getPage(pageNum);
          var fbBase = fbPage.getViewport({ scale: 1.0 });
          var fbDims = getTargetDimensions(fbBase);
          var fbW = Math.round(targetWidth || fbDims.width);
          var fbH = Math.round(fbW * (fbBase.height / fbBase.width));
          var fbScale = fbW / fbBase.width;
          var fbViewport = fbPage.getViewport({ scale: fbScale });
          var fbCanvas = document.createElement('canvas');
          var fbCtx = fbCanvas.getContext('2d', { alpha: false });
          fbCanvas.width = Math.round(fbViewport.width);
          fbCanvas.height = Math.round(fbViewport.height);
          fbCanvas.style.width = fbW + 'px';
          fbCanvas.style.height = fbH + 'px';
          fbCanvas.style.aspectRatio = (fbBase.width + ' / ' + fbBase.height);
          fbCanvas.style.display = 'block';
          fbCanvas.style.margin = '0 auto';
          fbCanvas.style.backgroundColor = '#ffffff';
          if (fbCtx) {
            fbCtx.fillStyle = '#ffffff';
            fbCtx.fillRect(0, 0, fbCanvas.width, fbCanvas.height);
          }
          await fbPage.render({ canvasContext: fbCtx, viewport: fbViewport, intent: 'print' }).promise;
          wrapper.innerHTML = '';
          wrapper.style.minHeight = fbH + 'px';
          wrapper.appendChild(fbCanvas);
          renderedPages.add(pageNum);
        } catch (fbErr) {
          console.error('Fatal render failure for page ' + pageNum + ':', fbErr);
        }
      } finally {
        renderingPages.delete(pageNum);
      }
    }

    // =========================================================================
    // 3. MOBILE PINCH-TO-ZOOM, PAN, & DOUBLE-TAP (TOUCH & GESTURES)
    // =========================================================================
    var currentScale = 1.0;
    var panX = 0;
    var panY = 0;
    var isPinching = false;
    var isPanning = false;
    var initialPinchDist = 0;
    var initialPinchScale = 1.0;
    var initialPinchMidX = 0;
    var initialPinchMidY = 0;
    var lastTouchX = 0;
    var lastTouchY = 0;
    var lastTapTime = 0;

    function applyTransform(animated) {
      zoomLayer.style.transition = animated ? 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)' : 'none';
      zoomLayer.style.transform = 'translate3d(' + panX + 'px, ' + panY + 'px, 0) scale(' + currentScale + ')';
    }

    function clampPan() {
      if (currentScale <= 1.02) {
        panX = 0;
        panY = 0;
        currentScale = 1.0;
        return;
      }
      var rect = container.getBoundingClientRect();
      var maxPanX = 0;
      var minPanX = rect.width * (1 - currentScale);
      panX = Math.min(maxPanX, Math.max(minPanX, panX));

      var layerHeight = zoomLayer.offsetHeight * currentScale;
      var minPanY = Math.min(0, rect.height - layerHeight);
      panY = Math.min(0, Math.max(minPanY, panY));
    }

    function getTouchesDist(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    // Touch event listeners for natural mobile pinch zoom and pan
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 2) {
        isPinching = true;
        isPanning = false;
        initialPinchDist = getTouchesDist(e.touches[0], e.touches[1]);
        initialPinchScale = currentScale;
        initialPinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        initialPinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      } else if (e.touches.length === 1) {
        isPinching = false;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        if (currentScale > 1.05) {
          isPanning = true;
        }

        // Double-tap to zoom in / reset
        var now = Date.now();
        if (now - lastTapTime < 300) {
          e.preventDefault();
          if (currentScale > 1.2) {
            currentScale = 1.0;
            panX = 0;
            panY = 0;
            applyTransform(true);
          } else {
            currentScale = 2.4;
            var cRect = container.getBoundingClientRect();
            var tapX = e.touches[0].clientX - cRect.left;
            var tapY = e.touches[0].clientY - cRect.top;
            panX = -(tapX * (currentScale - 1));
            panY = -(tapY * (currentScale - 1));
            clampPan();
            applyTransform(true);
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;
      }
    }, { passive: false });

    container.addEventListener('touchmove', function(e) {
      if (isPinching && e.touches.length === 2) {
        e.preventDefault();
        var currentDist = getTouchesDist(e.touches[0], e.touches[1]);
        if (initialPinchDist > 0) {
          var factor = currentDist / initialPinchDist;
          var nextScale = Math.min(6.0, Math.max(1.0, initialPinchScale * factor));
          currentScale = nextScale;

          var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          panX += (midX - initialPinchMidX) * 0.4;
          panY += (midY - initialPinchMidY) * 0.4;

          clampPan();
          applyTransform(false);
        }
      } else if (isPanning && e.touches.length === 1 && currentScale > 1.05) {
        var dx = e.touches[0].clientX - lastTouchX;
        var dy = e.touches[0].clientY - lastTouchY;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;

        panX += dx;
        panY += dy;
        clampPan();
        applyTransform(false);
        e.preventDefault();
      }
    }, { passive: false });

    container.addEventListener('touchend', function(e) {
      if (isPinching && e.touches.length < 2) {
        isPinching = false;
        if (currentScale <= 1.05) {
          currentScale = 1.0;
          panX = 0;
          panY = 0;
          applyTransform(true);
        } else {
          clampPan();
          applyTransform(true);
        }
      } else if (isPanning && e.touches.length === 0) {
        isPanning = false;
        clampPan();
        applyTransform(true);
      }
    });

    // Trackpad pinch / Ctrl+Wheel zoom for desktop & laptops
    container.addEventListener('wheel', function(e) {
      if (e.ctrlKey) {
        e.preventDefault();
        var delta = -e.deltaY * 0.01;
        var nextScale = Math.min(6.0, Math.max(1.0, currentScale + delta));
        currentScale = nextScale;
        clampPan();
        applyTransform(false);
      }
    }, { passive: false });

    // =========================================================================
    // 4. MOBILE BACK BUTTON & GESTURE COMMANDS
    // =========================================================================
    function triggerMobileBack() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage('EPS_READER_BACK', '*');
        }
      } catch (err) {}
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' || e.key === 'Backspace') {
        triggerMobileBack();
      }
    });

    window.addEventListener('popstate', function() {
      triggerMobileBack();
    });

    // Edge-swipe right to close (standard mobile app gesture)
    var edgeStartX = 0;
    var edgeStartY = 0;
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        edgeStartX = e.touches[0].clientX;
        edgeStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
      if (e.changedTouches.length === 1 && edgeStartX < 45 && currentScale <= 1.05) {
        var dx = e.changedTouches[0].clientX - edgeStartX;
        var dy = Math.abs(e.changedTouches[0].clientY - edgeStartY);
        if (dx > 85 && dy < 60) {
          triggerMobileBack();
        }
      }
    }, { passive: true });

    // =========================================================================
    // 5. MAIN INITIALIZATION
    // =========================================================================
    async function startRenderingDoc(pdfData) {
      var dataArray = pdfData instanceof Uint8Array ? pdfData : new Uint8Array(pdfData);
      var baseOrigin = (window.location && window.location.origin && window.location.origin.startsWith('http') && !window.location.origin.includes('localhost'))
        ? window.location.origin : 'https://examjk.com';
      var loadingTask = pdfjsLib.getDocument({
        data: dataArray,
        cMapUrl: baseOrigin + '/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: baseOrigin + '/standard_fonts/',
        disableFontFace: false,
        isEvalSupported: true,
        useSystemFonts: false
      });

      pdfDoc = await loadingTask.promise;
      var totalPages = pdfDoc.numPages;
      var currentWidth = getTargetWidth();

      // Immediately render Page 1 first so user sees the document in milliseconds!
      var wrap1 = document.createElement('div');
      wrap1.className = 'pdf-page-wrapper';
      wrap1.id = 'page-wrapper-1';
      wrap1.setAttribute('data-page-num', '1');
      zoomLayer.appendChild(wrap1);

      try {
        await renderPage(1, wrap1, currentWidth);
      } catch (e1) {
        console.warn('Page 1 render error:', e1);
      }

      // Hide loading view right away
      if (loadingView) loadingView.style.display = 'none';
      if (offlineBadge) offlineBadge.style.display = 'inline-block';

      // Create placeholders for remaining pages for smooth continuous layout
      for (var i = 2; i <= totalPages; i++) {
        var wrapper = document.createElement('div');
        wrapper.className = 'pdf-page-wrapper';
        wrapper.id = 'page-wrapper-' + i;
        wrapper.setAttribute('data-page-num', String(i));
        zoomLayer.appendChild(wrapper);
      }

      // Pre-render Page 2 immediately for smooth scrolling
      if (totalPages >= 2) {
        var initialWrap2 = document.getElementById('page-wrapper-2');
        if (initialWrap2) {
          renderPage(2, initialWrap2, currentWidth).catch(function() {});
        }
      }

      // Progressive IntersectionObserver for remaining pages
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var pageNum = parseInt(entry.target.getAttribute('data-page-num'), 10);
              if (!renderedPages.has(pageNum)) {
                renderPage(pageNum, entry.target, getTargetWidth());
              }
            }
          });
        }, {
          root: container,
          rootMargin: '800px 0px 800px 0px'
        });

        for (var k = 1; k <= totalPages; k++) {
          var wrapEl = document.getElementById('page-wrapper-' + k);
          if (wrapEl) observer.observe(wrapEl);
        }
      }

      // Scroll listener backup (vital for Smart Boards and older WebViews where IntersectionObserver may stall)
      function checkVisiblePages() {
        var screenW = getTargetWidth();
        for (var p = 1; p <= totalPages; p++) {
          if (!renderedPages.has(p)) {
            var el = document.getElementById('page-wrapper-' + p);
            if (el) {
              var rect = el.getBoundingClientRect();
              if (rect.top < window.innerHeight + 800 && rect.bottom > -800) {
                renderPage(p, el, screenW);
              }
            }
          }
        }
      }

      var scrollTimer = null;
      container.addEventListener('scroll', function() {
        if (scrollTimer) return;
        scrollTimer = setTimeout(function() {
          scrollTimer = null;
          checkVisiblePages();
        }, 100);
      }, { passive: true });

      // Handle window resize and screen orientation
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          var newWidth = getTargetWidth();
          renderedPages.clear();
          for (var p = 1; p <= totalPages; p++) {
            var el = document.getElementById('page-wrapper-' + p);
            if (el) {
              var rect = el.getBoundingClientRect();
              if (rect.top < window.innerHeight + 600 && rect.bottom > -600) {
                renderPage(p, el, newWidth);
              }
            }
          }
        }, 250);
      });

      // Immediate check for visible pages (critical for Smart Boards where observer doesn't fire immediately)
      setTimeout(checkVisiblePages, 50);
      setTimeout(checkVisiblePages, 500);

      // Smart Board Safety Watchdog: If after 3.5s page 1 is not rendered, force render page 1
      setTimeout(function() {
        if (renderedPages.size === 0) {
          console.warn('Smart Board Watchdog: Forcing render of page 1');
          var p1 = document.getElementById('page-wrapper-1');
          if (p1) renderPage(1, p1, getTargetWidth());
        }
      }, 3500);
    }

    async function initViewer() {
      var rawData = null;
      var targetDocUrl = sanitizeUrl(cleanUrl);
      try {
        rawData = await loadPdfDataForLifetime(targetDocUrl);
        // Create an independent copy so web worker postMessage does not detach the original ArrayBuffer
        var workingCopy = rawData.slice ? rawData.slice(0) : new Uint8Array(rawData).slice().buffer;
        await startRenderingDoc(workingCopy);
      } catch (err) {
        console.warn('Primary document render notice, attempting fallback:', err);
        try {
          if (!rawData) {
            rawData = await loadPdfDataForLifetime(targetDocUrl);
          }
          var fallbackCopy = rawData.slice ? rawData.slice(0) : new Uint8Array(rawData).slice().buffer;
          await startRenderingDoc(fallbackCopy);
        } catch (err2) {
          console.error('Fatal document error:', err2);
          showError('Unable to load document. Please check your internet connection and tap Retry.');
        }
      }
    }

    initViewer();
  })();
</script>
