<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes">
<title>Document Viewer</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    color: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-x pan-y pinch-zoom;
    -webkit-text-size-adjust: 100%;
  }
  #viewer-scroll-container {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: auto;
    background-color: #ffffff;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y pinch-zoom;
    position: relative;
  }
  #viewer-zoom-layer {
    width: 100%;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: 0 0;
    transition: transform 0.08s ease-out;
    will-change: transform;
  }
  .pdf-page-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 2px;
    background-color: #ffffff;
    min-height: 200px;
  }
  @media (min-width: 768px) {
    .pdf-page-wrapper {
      margin-bottom: 4px;
    }
  }
  canvas {
    display: block;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    background-color: #ffffff;
    box-shadow: none;
  }
  #loading-view {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background-color: #ffffff;
    z-index: 100;
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 3.5px solid rgba(0, 0, 0, 0.1);
    border-top-color: #1e3a8a;
    border-radius: 50%;
    animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 14px;
    font-weight: 700;
    color: #1e3a8a;
    letter-spacing: 0.3px;
    text-align: center;
    padding: 0 20px;
  }
  .loading-badge {
    font-size: 11px;
    font-weight: 800;
    color: #15803d;
    background-color: #dcfce7;
    border: 1px solid #bbf7d0;
    padding: 3px 10px;
    border-radius: 12px;
    display: none;
  }
  #error-view {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
    background-color: #0f172a;
    z-index: 100;
  }
  .error-title {
    font-size: 16px;
    font-weight: 700;
    color: #f87171;
  }
  .error-desc {
    font-size: 13px;
    color: #94a3b8;
    max-width: 400px;
    line-height: 1.5;
  }
  .retry-btn {
    margin-top: 8px;
    background-color: #38bdf8;
    color: #0f172a;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="loading-view">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-progress">Opening Document...</div>
  <div class="loading-badge" id="offline-badge">⚡ Stored Offline</div>
</div>

<div id="error-view">
  <div class="error-title">Unable to load document</div>
  <div class="error-desc" id="error-message">The requested PDF could not be displayed.</div>
  <button class="retry-btn" onclick="location.reload()">Retry</button>
</div>

<div id="viewer-scroll-container">
  <div id="viewer-zoom-layer"></div>
</div>

<script src="/pdf.min.js"></script>
<script>
  // Strictly prevent right-click context menu (no save/download popup)
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  // Disable common keyboard shortcuts for save / print
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'u')) {
      e.preventDefault();
    }
  });

  (function() {
    var params = new URLSearchParams(window.location.search);
    var rawUrl = params.get('url');

    var loadingView = document.getElementById('loading-view');
    var loadingProgress = document.getElementById('loading-progress');
    var offlineBadge = document.getElementById('offline-badge');
    var errorView = document.getElementById('error-view');
    var errorMessage = document.getElementById('error-message');
    var container = document.getElementById('viewer-scroll-container');
    var zoomLayer = document.getElementById('viewer-zoom-layer');

    if (!rawUrl) {
      showError('No document URL specified.');
      return;
    }

    var cleanUrl = rawUrl.split('#')[0].trim();
    var pdfDoc = null;
    var renderedPages = new Set();
    var renderingPages = new Set();
    var resizeTimer = null;

    if (typeof pdfjsLib === 'undefined') {
      showError('PDF viewer engine failed to initialize.');
      return;
    }

    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.js';
    } catch (e) {}

    function showError(msg) {
      if (loadingView) loadingView.style.display = 'none';
      if (errorView) {
        errorView.style.display = 'flex';
        if (errorMessage) errorMessage.textContent = msg || 'Failed to display document.';
      }
    }

    // =========================================================================
    // 1. LIFETIME OFFLINE STORAGE (Native IndexedDB + CacheStorage)
    // =========================================================================
    var DB_NAME = 'sigma_eps_offline_db';
    var DB_VERSION = 1;
    var STORE_FILES = 'offline_files';
    var CACHE_NAME = 'sigma_pdf_cache_v1';

    // Request permanent persistence from browser so OS never auto-cleans storage
    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.persist) {
      try {
        navigator.storage.persist().catch(function() {});
      } catch (e) {}
    }

    function getUrlVariants(url) {
      if (!url) return [];
      var clean = String(url).split('#')[0].trim();
      var set = {};
      set[clean] = true;
      try {
        var dec = decodeURIComponent(clean);
        set[dec] = true;
        set[encodeURI(dec)] = true;
        set[encodeURIComponent(dec)] = true;
      } catch (e) {}
      return Object.keys(set);
    }

    function openOfflineDb() {
      return new Promise(function(resolve) {
        if (!window.indexedDB) return resolve(null);
        try {
          var req = window.indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_FILES)) {
              db.createObjectStore(STORE_FILES, { keyPath: 'url' });
            }
          };
          req.onsuccess = function() { resolve(req.result); };
          req.onerror = function() { resolve(null); };
        } catch (e) {
          resolve(null);
        }
      });
    }

    function getFromDb(db, url) {
      return new Promise(function(resolve) {
        if (!db) return resolve(null);
        var variants = getUrlVariants(url);
        try {
          var tx = db.transaction(STORE_FILES, 'readonly');
          var store = tx.objectStore(STORE_FILES);
          var found = null;
          var count = 0;

          variants.forEach(function(v) {
            var req = store.get(v);
            req.onsuccess = function() {
              count++;
              if (!found && req.result && req.result.blob) {
                found = req.result.blob;
              }
              if (count === variants.length) resolve(found);
            };
            req.onerror = function() {
              count++;
              if (count === variants.length) resolve(found);
            };
          });
        } catch (e) {
          resolve(null);
        }
      });
    }

    function saveToDb(db, url, blob) {
      return new Promise(function(resolve) {
        if (!db || !blob) return resolve();
        var variants = getUrlVariants(url);
        try {
          var tx = db.transaction(STORE_FILES, 'readwrite');
          var store = tx.objectStore(STORE_FILES);
          variants.forEach(function(v) {
            store.put({
              url: v,
              blob: blob,
              size: blob.size,
              mimeType: blob.type || 'application/pdf',
              updatedAt: Date.now()
            });
          });
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { resolve(); };
        } catch (e) {
          resolve();
        }
      });
    }

    async function getFromCacheStorage(url) {
      if (typeof caches === 'undefined') return null;
      var variants = getUrlVariants(url);
      try {
        var cache = await caches.open(CACHE_NAME);
        for (var i = 0; i < variants.length; i++) {
          var matched = await cache.match(variants[i]);
          if (matched) {
            return await matched.blob();
          }
        }
      } catch (e) {}
      return null;
    }

    async function saveToCacheStorage(url, blob) {
      if (typeof caches === 'undefined' || !blob) return;
      var variants = getUrlVariants(url);
      try {
        var cache = await caches.open(CACHE_NAME);
        var resp = new Response(blob, {
          headers: {
            'Content-Type': 'application/pdf',
            'Content-Length': String(blob.size),
            'Cache-Control': 'public, max-age=31536000, immutable'
          }
        });
        variants.forEach(function(v) {
          cache.put(v, resp.clone()).catch(function() {});
        });
      } catch (e) {}
    }

    async function downloadPdfWithProgress(url, onProgress) {
      // 1. Try modern fetch with progressive stream reading (best for PWA & mobile apps)
      try {
        var resp = await fetch(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        var contentLength = resp.headers.get('content-length');
        var totalBytes = contentLength ? parseInt(contentLength, 10) : 0;

        if (!resp.body || !window.ReadableStream) {
          var directBlob = await resp.blob();
          if (onProgress) onProgress(100);
          return directBlob;
        }

        var reader = resp.body.getReader();
        var receivedBytes = 0;
        var chunks = [];

        while (true) {
          var res = await reader.read();
          if (res.done) break;
          chunks.push(res.value);
          receivedBytes += res.value.length;
          if (totalBytes > 0 && onProgress) {
            var pct = Math.min(99, Math.round((receivedBytes / totalBytes) * 100));
            onProgress(pct);
          }
        }

        if (onProgress) onProgress(100);
        return new Blob(chunks, { type: 'application/pdf' });
      } catch (fetchErr) {
        console.warn('Fetch stream download notice, trying XMLHttpRequest fallback:', fetchErr);
      }

      // 2. XMLHttpRequest fallback for older webviews
      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'blob';
        xhr.onprogress = function(e) {
          if (e.lengthComputable && e.total > 0) {
            var pct = Math.round((e.loaded / e.total) * 100);
            if (onProgress) onProgress(pct);
          }
        };
        xhr.onload = function() {
          if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
            if (onProgress) onProgress(100);
            resolve(xhr.response);
          } else {
            reject(new Error('HTTP status ' + xhr.status));
          }
        };
        xhr.onerror = function() {
          reject(new Error('Network connection error while fetching PDF.'));
        };
        xhr.send();
      });
    }

    async function loadPdfDataForLifetime(url) {
      // 0. If directly passed a local blob: URL
      if (url.startsWith('blob:')) {
        try {
          var blobResp = await fetch(url);
          var blobObj = await blobResp.blob();
          if (loadingView) loadingView.style.display = 'none';
          return await blobObj.arrayBuffer();
        } catch (e) {}
      }

      var db = await openOfflineDb();

      // Step 1: Check persistent IndexedDB
      var blob = await getFromDb(db, url);

      // Step 2: Check persistent CacheStorage
      if (!blob) {
        blob = await getFromCacheStorage(url);
      }

      if (blob) {
        // Instant 0ms cached display!
        if (loadingView) loadingView.style.display = 'none';
        if (offlineBadge) offlineBadge.style.display = 'inline-block';
        return await blob.arrayBuffer();
      }

      // Step 3: Fetch over network with progress bar and store permanently for lifetime
      if (loadingProgress) loadingProgress.textContent = 'Opening Document... 0%';
      var downloadedBlob = await downloadPdfWithProgress(url, function(pct) {
        if (loadingProgress) loadingProgress.textContent = 'Opening Document... ' + pct + '%';
      });

      // Save to IndexedDB & CacheStorage in background for lifetime offline access
      saveToDb(db, url, downloadedBlob);
      saveToCacheStorage(url, downloadedBlob);

      return await downloadedBlob.arrayBuffer();
    }

    // =========================================================================
    // 2. DOCUMENT RENDERING ENGINE
    // =========================================================================
    function getTargetWidth() {
      var w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 1000;
      return w;
    }

    async function renderPage(pageNum, wrapper, targetWidth, renderScaleMultiplier) {
      if (renderingPages.has(pageNum)) return;
      renderingPages.add(pageNum);

      try {
        var page = await pdfDoc.getPage(pageNum);
        var baseViewport = page.getViewport({ scale: 1.0 });
        var widthToUse = targetWidth || getTargetWidth();
        var baseScale = widthToUse / baseViewport.width;
        var mult = renderScaleMultiplier || 1.0;
        var viewport = page.getViewport({ scale: baseScale * mult });

        var dpr = Math.min(window.devicePixelRatio || 1, 2.5);

        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d', { alpha: false });

        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);

        canvas.style.width = '100%';
        canvas.style.height = 'auto';

        ctx.scale(dpr, dpr);

        await page.render({
          canvasContext: ctx,
          viewport: viewport,
          intent: 'display'
        }).promise;

        wrapper.innerHTML = '';
        wrapper.style.minHeight = Math.floor(viewport.height / mult) + 'px';
        wrapper.appendChild(canvas);

        renderedPages.add(pageNum);
      } catch (err) {
        console.warn('Page render error page ' + pageNum + ':', err);
      } finally {
        renderingPages.delete(pageNum);
      }
    }

    // =========================================================================
    // 3. MOBILE PINCH-TO-ZOOM, PAN, & DOUBLE-TAP (TOUCH & GESTURES)
    // =========================================================================
    var currentScale = 1.0;
    var panX = 0;
    var panY = 0;
    var isPinching = false;
    var isPanning = false;
    var initialPinchDist = 0;
    var initialPinchScale = 1.0;
    var initialPinchMidX = 0;
    var initialPinchMidY = 0;
    var lastTouchX = 0;
    var lastTouchY = 0;
    var lastTapTime = 0;

    function applyTransform(animated) {
      zoomLayer.style.transition = animated ? 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)' : 'none';
      zoomLayer.style.transform = 'translate3d(' + panX + 'px, ' + panY + 'px, 0) scale(' + currentScale + ')';
    }

    function clampPan() {
      if (currentScale <= 1.02) {
        panX = 0;
        panY = 0;
        currentScale = 1.0;
        return;
      }
      var rect = container.getBoundingClientRect();
      var maxPanX = 0;
      var minPanX = rect.width * (1 - currentScale);
      panX = Math.min(maxPanX, Math.max(minPanX, panX));

      var layerHeight = zoomLayer.offsetHeight * currentScale;
      var minPanY = Math.min(0, rect.height - layerHeight);
      panY = Math.min(0, Math.max(minPanY, panY));
    }

    function getTouchesDist(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    // Touch event listeners for natural mobile pinch zoom and pan
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 2) {
        isPinching = true;
        isPanning = false;
        initialPinchDist = getTouchesDist(e.touches[0], e.touches[1]);
        initialPinchScale = currentScale;
        initialPinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        initialPinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      } else if (e.touches.length === 1) {
        isPinching = false;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        if (currentScale > 1.05) {
          isPanning = true;
        }

        // Double-tap to zoom in / reset
        var now = Date.now();
        if (now - lastTapTime < 300) {
          e.preventDefault();
          if (currentScale > 1.2) {
            currentScale = 1.0;
            panX = 0;
            panY = 0;
            applyTransform(true);
          } else {
            currentScale = 2.4;
            var cRect = container.getBoundingClientRect();
            var tapX = e.touches[0].clientX - cRect.left;
            var tapY = e.touches[0].clientY - cRect.top;
            panX = -(tapX * (currentScale - 1));
            panY = -(tapY * (currentScale - 1));
            clampPan();
            applyTransform(true);
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;
      }
    }, { passive: false });

    container.addEventListener('touchmove', function(e) {
      if (isPinching && e.touches.length === 2) {
        e.preventDefault();
        var currentDist = getTouchesDist(e.touches[0], e.touches[1]);
        if (initialPinchDist > 0) {
          var factor = currentDist / initialPinchDist;
          var nextScale = Math.min(6.0, Math.max(1.0, initialPinchScale * factor));
          currentScale = nextScale;

          var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          panX += (midX - initialPinchMidX) * 0.4;
          panY += (midY - initialPinchMidY) * 0.4;

          clampPan();
          applyTransform(false);
        }
      } else if (isPanning && e.touches.length === 1 && currentScale > 1.05) {
        var dx = e.touches[0].clientX - lastTouchX;
        var dy = e.touches[0].clientY - lastTouchY;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;

        panX += dx;
        panY += dy;
        clampPan();
        applyTransform(false);
        e.preventDefault();
      }
    }, { passive: false });

    container.addEventListener('touchend', function(e) {
      if (isPinching && e.touches.length < 2) {
        isPinching = false;
        if (currentScale <= 1.05) {
          currentScale = 1.0;
          panX = 0;
          panY = 0;
          applyTransform(true);
        } else {
          clampPan();
          applyTransform(true);
        }
      } else if (isPanning && e.touches.length === 0) {
        isPanning = false;
        clampPan();
        applyTransform(true);
      }
    });

    // Trackpad pinch / Ctrl+Wheel zoom for desktop & laptops
    container.addEventListener('wheel', function(e) {
      if (e.ctrlKey) {
        e.preventDefault();
        var delta = -e.deltaY * 0.01;
        var nextScale = Math.min(6.0, Math.max(1.0, currentScale + delta));
        currentScale = nextScale;
        clampPan();
        applyTransform(false);
      }
    }, { passive: false });

    // =========================================================================
    // 4. MOBILE BACK BUTTON & GESTURE COMMANDS
    // =========================================================================
    function triggerMobileBack() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage('EPS_READER_BACK', '*');
        }
      } catch (err) {}
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' || e.key === 'Backspace') {
        triggerMobileBack();
      }
    });

    window.addEventListener('popstate', function() {
      triggerMobileBack();
    });

    // Edge-swipe right to close (standard mobile app gesture)
    var edgeStartX = 0;
    var edgeStartY = 0;
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        edgeStartX = e.touches[0].clientX;
        edgeStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
      if (e.changedTouches.length === 1 && edgeStartX < 45 && currentScale <= 1.05) {
        var dx = e.changedTouches[0].clientX - edgeStartX;
        var dy = Math.abs(e.changedTouches[0].clientY - edgeStartY);
        if (dx > 85 && dy < 60) {
          triggerMobileBack();
        }
      }
    }, { passive: true });

    // =========================================================================
    // 5. MAIN INITIALIZATION
    // =========================================================================
    async function startRenderingDoc(pdfData) {
      var dataArray = pdfData instanceof Uint8Array ? pdfData : new Uint8Array(pdfData);
      var loadingTask = pdfjsLib.getDocument({
        data: dataArray,
        isEvalSupported: false,
        useSystemFonts: true
      });

      pdfDoc = await loadingTask.promise;
      if (loadingView) loadingView.style.display = 'none';

      var totalPages = pdfDoc.numPages;
      var currentWidth = getTargetWidth();

      // Create placeholders for all pages for smooth continuous layout
      for (var i = 1; i <= totalPages; i++) {
        var wrapper = document.createElement('div');
        wrapper.className = 'pdf-page-wrapper';
        wrapper.id = 'page-wrapper-' + i;
        wrapper.setAttribute('data-page-num', String(i));
        zoomLayer.appendChild(wrapper);
      }

      // Render first 2 pages immediately
      for (var j = 1; j <= Math.min(totalPages, 2); j++) {
        var initialWrap = document.getElementById('page-wrapper-' + j);
        if (initialWrap) renderPage(j, initialWrap, currentWidth);
      }

      // Progressive IntersectionObserver for remaining pages
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var pageNum = parseInt(entry.target.getAttribute('data-page-num'), 10);
              if (!renderedPages.has(pageNum)) {
                renderPage(pageNum, entry.target, getTargetWidth());
              }
            }
          });
        }, {
          root: container,
          rootMargin: '600px 0px 600px 0px'
        });

        for (var k = 1; k <= totalPages; k++) {
          var wrapEl = document.getElementById('page-wrapper-' + k);
          if (wrapEl) observer.observe(wrapEl);
        }
      } else {
        for (var m = 3; m <= totalPages; m++) {
          var w = document.getElementById('page-wrapper-' + m);
          if (w) await renderPage(m, w, currentWidth);
        }
      }

      // Handle window resize and screen orientation
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          var newWidth = getTargetWidth();
          renderedPages.clear();
          for (var p = 1; p <= totalPages; p++) {
            var el = document.getElementById('page-wrapper-' + p);
            if (el) {
              var rect = el.getBoundingClientRect();
              if (rect.top < window.innerHeight + 600 && rect.bottom > -600) {
                renderPage(p, el, newWidth);
              }
            }
          }
        }, 250);
      });
    }

    async function initViewer() {
      var rawData = null;
      try {
        rawData = await loadPdfDataForLifetime(cleanUrl);
        // Create an independent copy so web worker postMessage does not detach the original ArrayBuffer
        var workingCopy = rawData.slice ? rawData.slice(0) : new Uint8Array(rawData).slice().buffer;
        await startRenderingDoc(workingCopy);
      } catch (err) {
        console.warn('Primary worker render notice, attempting single-thread fallback:', err);
        try {
          // Fallback if web worker is restricted by WebView sandbox
          if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = '';
          }
          if (!rawData) {
            rawData = await loadPdfDataForLifetime(cleanUrl);
          }
          var fallbackCopy = rawData.slice ? rawData.slice(0) : new Uint8Array(rawData).slice().buffer;
          await startRenderingDoc(fallbackCopy);
        } catch (err2) {
          console.error('Fatal document error:', err2);
          showError('Unable to load document. Please check your connection and tap Retry.');
        }
      }
    }

    initViewer();
  })();
</script>
