<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Document Viewer</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #0f172a;
    color: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-x pan-y;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none !important;
    overscroll-behavior-y: none !important;
    -webkit-overscroll-behavior-y: none !important;
  }
  #viewer-scroll-container {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: auto;
    background-color: #334155;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
    position: relative;
    overscroll-behavior: none !important;
    overscroll-behavior-y: none !important;
    -webkit-overscroll-behavior-y: none !important;
  }
  #viewer-zoom-layer {
    min-width: 100%;
    width: 100%;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: 0 0;
    gap: 0;
  }
  .pdf-page-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    background-color: transparent;
    box-sizing: border-box;
    margin: 0 auto;
    line-height: 0;
    font-size: 0;
  }
  @media (min-width: 768px) {
    .pdf-page-wrapper {
      padding: 0;
    }
  }
  canvas {
    display: block;
    background-color: #ffffff;
    box-shadow: none;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    image-rendering: auto;
    vertical-align: top;
  }
  #loading-view {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background-color: #0f172a;
    z-index: 100;
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 3.5px solid rgba(255, 255, 255, 0.15);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 14px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: 0.3px;
    text-align: center;
    padding: 0 20px;
  }
  .loading-badge {
    font-size: 11px;
    font-weight: 800;
    color: #4ade80;
    background-color: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    padding: 3px 10px;
    border-radius: 12px;
    display: none;
  }
  #error-view {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
    background-color: #0f172a;
    z-index: 100;
  }
  .error-title {
    font-size: 16px;
    font-weight: 700;
    color: #f87171;
  }
  .error-desc {
    font-size: 13px;
    color: #94a3b8;
    max-width: 400px;
    line-height: 1.5;
  }
  .retry-btn {
    margin-top: 8px;
    background-color: #38bdf8;
    color: #0f172a;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

</style>
</head>
<body>

<div id="loading-view">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-progress">Opening Document...</div>
  <div class="loading-badge" id="offline-badge">⚡ Stored Offline</div>
</div>

<div id="error-view">
  <div class="error-title">Unable to load document</div>
  <div class="error-desc" id="error-message">The requested PDF could not be displayed.</div>
  <button class="retry-btn" onclick="location.reload()">Retry</button>
</div>

<div id="viewer-scroll-container">
  <div id="viewer-zoom-layer"></div>
</div>

<script src="/pdf.worker.min.js"></script>
<script src="/pdf.min.js"></script>
<script>
  // Strictly prevent right-click context menu (no save/download popup)
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  // Disable common keyboard shortcuts for save / print
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'u')) {
      e.preventDefault();
    }
  });

  (function() {
    function sanitizeUrl(u) {
      if (!u) return '';
      var clean = String(u).split('#')[0].trim();
      try {
        return encodeURI(decodeURI(clean));
      } catch (e) {
        return encodeURI(clean);
      }
    }

    function toAbsoluteUrl(u) {
      if (!u) return '';
      var clean = sanitizeUrl(u);
      if (/^https?:\/\//i.test(clean) || clean.startsWith('blob:') || clean.startsWith('data:')) {
        return clean;
      }
      var origin = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
      if (!origin || origin.indexOf('http') !== 0 || origin.includes('localhost') || origin.startsWith('file:') || origin.startsWith('capacitor:')) {
        origin = 'https://examjk.com';
      }
      return origin + (clean.startsWith('/') ? clean : '/' + clean);
    }

    var params = new URLSearchParams(window.location.search);
    var rawUrl = params.get('url');

    var loadingView = document.getElementById('loading-view');
    var loadingProgress = document.getElementById('loading-progress');
    var offlineBadge = document.getElementById('offline-badge');
    var errorView = document.getElementById('error-view');
    var errorMessage = document.getElementById('error-message');
    var container = document.getElementById('viewer-scroll-container');
    var zoomLayer = document.getElementById('viewer-zoom-layer');

    var ZOOM_LEVELS = [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.4, 2.88, 3.5, 4.0, 5.0];

    if (!rawUrl) {
      showError('No document URL specified.');
      return;
    }

    var cleanUrl = sanitizeUrl(rawUrl);
    var pdfDoc = null;
    var renderedPages = new Set();
    var renderingPages = new Set();
    var activeRenderTasks = new Map();
    var resizeTimer = null;
    var reRenderDebounceTimer = null;

    // View state
    var viewMode = 'fit-width'; // 'fit-width', 'fit-page', 'custom'
    var userZoom = 1.0; // 1.0 = 100%, 2.0 = 200%, 2.88 = 288%

    if (typeof pdfjsLib === 'undefined') {
      showError('PDF viewer engine failed to initialize.');
      return;
    }

    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.js';
    } catch (e) {}

    function showError(msg) {
      if (loadingView) loadingView.style.display = 'none';
      if (errorView) {
        errorView.style.display = 'flex';
        if (errorMessage) errorMessage.textContent = msg || 'Failed to display document.';
      }
    }

    function readBlobAsArrayBuffer(blob) {
      if (!blob) return Promise.resolve(null);
      if (typeof blob.arrayBuffer === 'function') {
        return blob.arrayBuffer();
      }
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = function() { reject(reader.error || new Error('FileReader failed')); };
        reader.readAsArrayBuffer(blob);
      });
    }

    // =========================================================================
    // 1. LIFETIME OFFLINE STORAGE (Native IndexedDB + CacheStorage + RAM Cache)
    // =========================================================================
    var DB_NAME = 'sigma_eps_offline_db';
    var DB_VERSION = 1;
    var STORE_FILES = 'offline_files';
    var CACHE_NAME = 'sigma_pdf_cache_v1';

    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.persist) {
      try {
        navigator.storage.persist().catch(function() {});
      } catch (e) {}
    }

    function getUrlVariants(url) {
      if (!url) return [];
      var clean = String(url).split('#')[0].trim();
      var set = {};
      set[clean] = true;
      try {
        var dec = decodeURI(clean);
        set[dec] = true;
        set[encodeURI(dec)] = true;
        set[encodeURIComponent(dec)] = true;
        var decFull = decodeURIComponent(clean);
        set[decFull] = true;
        set[encodeURI(decFull)] = true;
      } catch (e) {}
      return Object.keys(set);
    }

    function openOfflineDb() {
      return new Promise(function(resolve) {
        if (!window.indexedDB) return resolve(null);
        try {
          var req = window.indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_FILES)) {
              db.createObjectStore(STORE_FILES, { keyPath: 'url' });
            }
          };
          req.onsuccess = function() { resolve(req.result); };
          req.onerror = function() { resolve(null); };
        } catch (e) {
          resolve(null);
        }
      });
    }

    function getFromDb(db, url) {
      return new Promise(function(resolve) {
        if (!db) return resolve(null);
        var variants = getUrlVariants(url);
        try {
          var tx = db.transaction(STORE_FILES, 'readonly');
          var store = tx.objectStore(STORE_FILES);
          var found = null;
          var count = 0;

          variants.forEach(function(v) {
            var req = store.get(v);
            req.onsuccess = function() {
              count++;
              if (!found && req.result && req.result.blob) {
                found = req.result.blob;
              }
              if (count === variants.length) resolve(found);
            };
            req.onerror = function() {
              count++;
              if (count === variants.length) resolve(found);
            };
          });
        } catch (e) {
          resolve(null);
        }
      });
    }

    function saveToDb(db, url, blob) {
      return new Promise(function(resolve) {
        if (!db || !blob) return resolve();
        var variants = getUrlVariants(url);
        try {
          var tx = db.transaction(STORE_FILES, 'readwrite');
          var store = tx.objectStore(STORE_FILES);
          variants.forEach(function(v) {
            store.put({
              url: v,
              blob: blob,
              size: blob.size,
              mimeType: blob.type || 'application/pdf',
              updatedAt: Date.now()
            });
          });
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { resolve(); };
        } catch (e) {
          resolve();
        }
      });
    }

    async function getFromCacheStorage(url) {
      if (typeof caches === 'undefined') return null;
      var variants = getUrlVariants(url);
      try {
        var cache = await caches.open(CACHE_NAME);
        for (var i = 0; i < variants.length; i++) {
          var matched = await cache.match(variants[i]);
          if (matched) {
            return await matched.blob();
          }
        }
      } catch (e) {}
      return null;
    }

    async function saveToCacheStorage(url, blob) {
      if (typeof caches === 'undefined' || !blob) return;
      var variants = getUrlVariants(url);
      try {
        var cache = await caches.open(CACHE_NAME);
        var resp = new Response(blob, {
          headers: {
            'Content-Type': 'application/pdf',
            'Content-Length': String(blob.size),
            'Cache-Control': 'public, max-age=31536000, immutable'
          }
        });
        variants.forEach(function(v) {
          cache.put(v, resp.clone()).catch(function() {});
        });
      } catch (e) {}
    }

    async function downloadPdfWithProgress(url, onProgress) {
      var fetchUrl = toAbsoluteUrl(url);

      try {
        var resp = await fetch(fetchUrl);
        if (resp.ok) {
          if (onProgress) onProgress(100);
          var buf = await resp.arrayBuffer();
          if (buf && buf.byteLength > 1000) {
            return buf;
          }
        }
      } catch (fetchErr) {
        console.warn('Fetch notice, trying XHR fallback:', fetchErr);
      }

      return new Promise(function(resolve, reject) {
        function tryFetchUrl(targetUrl, onFail) {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', targetUrl, true);
          xhr.responseType = 'arraybuffer';
          xhr.onprogress = function(e) {
            if (e.lengthComputable && e.total > 0 && onProgress) {
              var pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
              onProgress(pct);
            }
          };
          xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
              if (onProgress) onProgress(100);
              resolve(xhr.response);
            } else if (onFail) {
              onFail();
            } else {
              reject(new Error('HTTP status ' + xhr.status));
            }
          };
          xhr.onerror = function() {
            if (onFail) {
              onFail();
            } else {
              reject(new Error('Network error fetching document.'));
            }
          };
          xhr.send();
        }

        tryFetchUrl(fetchUrl, function() {
          if (!fetchUrl.startsWith('https://examjk.com') && !url.startsWith('blob:') && !url.startsWith('data:')) {
            var directFallback = 'https://examjk.com' + (url.startsWith('/') ? url : '/' + url);
            tryFetchUrl(directFallback, null);
          } else {
            reject(new Error('Network error fetching document.'));
          }
        });
      });
    }

    async function loadCachedPdfBuffer(url) {
      var validUrl = sanitizeUrl(url);
      var variants = getUrlVariants(validUrl);
      if (validUrl !== url) {
        var origVariants = getUrlVariants(url);
        for (var ov = 0; ov < origVariants.length; ov++) {
          if (variants.indexOf(origVariants[ov]) === -1) variants.push(origVariants[ov]);
        }
      }

      try {
        var ramCache = (window.parent && window.parent !== window && window.parent.__SIGMA_BUFFER_CACHE__)
          ? window.parent.__SIGMA_BUFFER_CACHE__ : (window.__SIGMA_BUFFER_CACHE__ || null);
        if (ramCache) {
          for (var r = 0; r < variants.length; r++) {
            if (ramCache.has(variants[r])) {
              var mBuf = ramCache.get(variants[r]);
              if (mBuf && (mBuf.byteLength > 1000 || (mBuf.buffer && mBuf.buffer.byteLength > 1000))) {
                return mBuf.slice ? mBuf.slice(0) : mBuf;
              }
            }
          }
        }
      } catch (e) {}

      if (url.startsWith('blob:') || validUrl.startsWith('blob:')) {
        try {
          var blobResp = await fetch(validUrl);
          var blobObj = await blobResp.blob();
          return await readBlobAsArrayBuffer(blobObj);
        } catch (e) {}
      }

      var db = await openOfflineDb();
      var blob = await getFromDb(db, validUrl);
      if (!blob && validUrl !== url) {
        blob = await getFromDb(db, url);
      }
      if (!blob) {
        blob = await getFromCacheStorage(validUrl);
      }
      if (!blob && validUrl !== url) {
        blob = await getFromCacheStorage(url);
      }

      if (blob) {
        var cachedArrBuf = await readBlobAsArrayBuffer(blob);
        try {
          var pCache = (window.parent && window.parent !== window && window.parent.__SIGMA_BUFFER_CACHE__)
            ? window.parent.__SIGMA_BUFFER_CACHE__ : (window.__SIGMA_BUFFER_CACHE__ || null);
          if (pCache && cachedArrBuf) {
            variants.forEach(function(v) { pCache.set(v, cachedArrBuf); });
          }
        } catch (e) {}
        return cachedArrBuf;
      }

      return null;
    }

    // =========================================================================
    // 2. DYNAMIC DIMENSIONS & VECTOR RENDERING ENGINE (ADOBE ACROBAT CLARITY)
    // =========================================================================
    function getTargetDimensions(baseViewport) {
      var screenWidth = container.clientWidth || window.innerWidth || 1000;
      var screenHeight = container.clientHeight || window.innerHeight || 800;

      var pageW = (baseViewport && baseViewport.width) ? baseViewport.width : 595.28;
      var pageH = (baseViewport && baseViewport.height) ? baseViewport.height : 841.89;
      var pageAspect = pageH / pageW;

      if (viewMode === 'fit-page') {
        // Fit entire page vertically and horizontally with zero clipping
        var availH = screenHeight - 20;
        var availW = screenWidth - 16;
        var scaleH = availH / pageH;
        var scaleW = availW / pageW;
        var fitScale = Math.min(scaleH, scaleW);
        var finalW = Math.max(320, Math.round(pageW * fitScale));
        return { width: finalW, height: Math.floor(finalW * pageAspect), scale: fitScale };
      } else if (viewMode === 'custom' && userZoom > 1.05) {
        // User zoom (magnification above 100%): True physical magnification
        var baseW = screenWidth < 768 ? screenWidth : Math.max(600, screenWidth - 24);
        var scaledW = Math.round(baseW * userZoom);
        return { width: scaledW, height: Math.floor(scaledW * pageAspect), scale: (scaledW / pageW) };
      } else {
        // 'fit-width' (Default / Zoom Out): Full screen width fit with zero margins!
        var fitWidth = screenWidth < 768 ? screenWidth : Math.max(600, screenWidth - 24);
        return { width: fitWidth, height: Math.floor(fitWidth * pageAspect), scale: (fitWidth / pageW) };
      }
    }

    function getTargetWidth(baseViewport) {
      return getTargetDimensions(baseViewport).width;
    }

    async function renderPage(pageNum, wrapper) {
      if (!pdfDoc) return;

      // Cancel previous in-flight render task if zoom or layout changed
      if (activeRenderTasks.has(pageNum)) {
        try {
          activeRenderTasks.get(pageNum).cancel();
        } catch (e) {}
        activeRenderTasks.delete(pageNum);
      }

      try {
        var page = await pdfDoc.getPage(pageNum);
        var baseViewport = page.getViewport({ scale: 1.0 });
        var dims = getTargetDimensions(baseViewport);
        var displayWidth = dims.width;
        var displayHeight = dims.height;

        var dpr = window.devicePixelRatio || 1;
        // High-DPI backing scale:
        // For Adobe Acrobat-level razor-sharp vector clarity:
        // Use full screen DPR (e.g. 2.0x on Mac Retina / 3.0x on OLED phones), with minimum 2.0x for subpixel font anti-aliasing.
        var isLowMem = (typeof navigator !== 'undefined' && navigator.deviceMemory && navigator.deviceMemory <= 1);
        var backingScale = isLowMem ? Math.min(dpr, 1.5) : Math.max(dpr, 2.0);

        var finalScale = (displayWidth / baseViewport.width) * backingScale;

        // Hardware safety guard: prevent canvas dimension from exceeding hardware GPU texture limit (16384 on Mac/PC, 8192 on mobile, 4096 on 1GB RAM)
        var maxDim = isLowMem ? 4096 : ((window.innerWidth < 768) ? 8192 : 16384);
        if (baseViewport.width * finalScale > maxDim || baseViewport.height * finalScale > maxDim) {
          finalScale = Math.min(maxDim / baseViewport.width, maxDim / baseViewport.height);
        }

        var scaledViewport = page.getViewport({ scale: finalScale });

        var existingCanvas = wrapper.querySelector('canvas');

        // DOUBLE BUFFERING: Render onto an off-screen canvas in the background!
        // The existing canvas stays visible on screen without interruption, completely eliminating flicker and white flash!
        var newCanvas = document.createElement('canvas');
        newCanvas.width = Math.round(scaledViewport.width);
        newCanvas.height = Math.round(scaledViewport.height);
        newCanvas.style.width = displayWidth + 'px';
        newCanvas.style.height = displayHeight + 'px';
        newCanvas.style.aspectRatio = (baseViewport.width + ' / ' + baseViewport.height);
        newCanvas.style.display = 'block';
        newCanvas.style.margin = '0 auto';
        newCanvas.style.backgroundColor = '#ffffff';

        var ctx = newCanvas.getContext('2d', { alpha: false });
        if (ctx) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);
          ctx.imageSmoothingEnabled = true;
          if ('imageSmoothingQuality' in ctx) {
            ctx.imageSmoothingQuality = 'high';
          }
        }

        // Render PDF directly using PDF.js vector rasterizer at full physical device resolution
        var renderTask = page.render({
          canvasContext: ctx,
          viewport: scaledViewport
        });

        activeRenderTasks.set(pageNum, renderTask);
        await renderTask.promise;
        activeRenderTasks.delete(pageNum);

        // ATOMIC SWAP: Replace the visible canvas instantaneously when the new crisp render is ready!
        if (existingCanvas && existingCanvas.parentNode === wrapper) {
          wrapper.replaceChild(newCanvas, existingCanvas);
          existingCanvas.width = 0;
          existingCanvas.height = 0;
        } else {
          wrapper.innerHTML = '';
          wrapper.appendChild(newCanvas);
        }

        wrapper.style.minHeight = displayHeight + 'px';
        wrapper.style.width = displayWidth + 'px';
        renderedPages.add(pageNum);
      } catch (err) {
        if (err && err.name === 'RenderingCancelledException') {
          return; // Normal cancellation during rapid zoom changes
        }
        console.warn('Page ' + pageNum + ' render notice:', err);
      }
    }

    function unrenderPage(pageNum, wrapper) {
      if (!renderedPages.has(pageNum)) return;
      if (activeRenderTasks.has(pageNum)) {
        try { activeRenderTasks.get(pageNum).cancel(); } catch (e) {}
        activeRenderTasks.delete(pageNum);
      }
      var canvas = wrapper.querySelector('canvas');
      if (canvas) {
        canvas.width = 0;
        canvas.height = 0;
        wrapper.innerHTML = '';
      }
      renderedPages.delete(pageNum);
    }

    // Update all page wrapper placeholders to current target dimensions
    function updateAllWrapperDimensions() {
      if (!pdfDoc) return;
      var dims = getTargetDimensions({ width: 595.28, height: 841.89 });
      var screenWidth = container.clientWidth || window.innerWidth || 1000;
      if (dims.width > screenWidth) {
        zoomLayer.style.alignItems = 'flex-start';
        zoomLayer.style.width = dims.width + 'px';
      } else {
        zoomLayer.style.alignItems = 'center';
        zoomLayer.style.width = '100%';
      }
      for (var p = 1; p <= pdfDoc.numPages; p++) {
        var el = document.getElementById('page-wrapper-' + p);
        if (el) {
          el.style.width = dims.width + 'px';
          el.style.minHeight = dims.height + 'px';
          var cv = el.querySelector('canvas');
          if (cv) {
            cv.style.width = dims.width + 'px';
            cv.style.height = dims.height + 'px';
          }
        }
      }
    }

    // Re-render all currently visible pages at the new vector zoom scale
    function reRenderVisiblePages() {
      if (!pdfDoc) return;
      var total = pdfDoc.numPages;
      renderedPages.clear();

      for (var p = 1; p <= total; p++) {
        var el = document.getElementById('page-wrapper-' + p);
        if (el) {
          var rect = el.getBoundingClientRect();
          // Render if inside or close to visible window
          if (rect.top < window.innerHeight + 800 && rect.bottom > -800) {
            renderPage(p, el);
          }
        }
      }
    }

    function debouncedReRender() {
      clearTimeout(reRenderDebounceTimer);
      reRenderDebounceTimer = setTimeout(function() {
        reRenderVisiblePages();
      }, 150);
    }

    function updateToolbarUI() {}

    // Pull-Down-To-Refresh Neutralizer: When at top of PDF (scrollTop <= 0), prevent downward swipe reload
    function disableAppRefresh() {
      try {
        if (window.AndroidApp) {
          if (typeof window.AndroidApp.setSwipeRefreshEnabled === "function") window.AndroidApp.setSwipeRefreshEnabled(false);
          if (typeof window.AndroidApp.setPdfOpen === "function") window.AndroidApp.setPdfOpen(true);
        }
        if (window.parent && window.parent.AndroidApp) {
          if (typeof window.parent.AndroidApp.setSwipeRefreshEnabled === "function") window.parent.AndroidApp.setSwipeRefreshEnabled(false);
          if (typeof window.parent.AndroidApp.setPdfOpen === "function") window.parent.AndroidApp.setPdfOpen(true);
        }
        if (window.top && window.top.AndroidApp) {
          if (typeof window.top.AndroidApp.setSwipeRefreshEnabled === "function") window.top.AndroidApp.setSwipeRefreshEnabled(false);
          if (typeof window.top.AndroidApp.setPdfOpen === "function") window.top.AndroidApp.setPdfOpen(true);
        }
      } catch (err) {}
    }
    disableAppRefresh();
    window.addEventListener('touchstart', disableAppRefresh, { passive: true });

    var singleTouchStartY = 0;
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        singleTouchStartY = e.touches[0].clientY;
      }
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage('EPS_AUDIO_COLLAPSE', '*');
        }
      } catch (err) {}
    }, { passive: true });

    container.addEventListener('mousedown', function(e) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage('EPS_AUDIO_COLLAPSE', '*');
        }
      } catch (err) {}
    }, { passive: true });

    container.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1 && !isPinching) {
        var dy = e.touches[0].clientY - singleTouchStartY;
        if (container.scrollTop <= 0 && dy > 0) {
          e.preventDefault(); // Kills pull-down-to-refresh completely!
        }
      }
    }, { passive: false });

    // =========================================================================
    // 4. ANCHORED FOCAL-POINT ZOOM & RETURN-BACK ENGINE
    // =========================================================================
    var isPinching = false;
    var initialPinchDist = 0;
    var pinchStartZoom = 1.0;
    var currentPinchScale = 1.0;
    var pinchStartMidX = 0;
    var pinchStartMidY = 0;
    var pinchMidX = 0;
    var pinchMidY = 0;
    var pinchDocPointX = 0;
    var pinchDocPointY = 0;
    var pinchDocAnchorX = 0;
    var pinchDocAnchorY = 0;
    var lastTapTime = 0;

    function getTouchesDist(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    // Double-click / double-tap anywhere on screen: Zoom from fixed point & return back to Fit Width!
    function handleScreenDoubleClick(clientX, clientY) {
      var rect = container.getBoundingClientRect();
      var vx = clientX - rect.left;
      var vy = clientY - rect.top;
      var px = container.scrollLeft + vx;
      var py = container.scrollTop + vy;
      var oldZoom = (viewMode === 'custom') ? userZoom : 1.0;

      if (viewMode !== 'fit-width' || userZoom > 1.05) {
        // Return back to Fit Width! Fits screen width 100% cleanly!
        viewMode = 'fit-width';
        userZoom = 1.0;
        var ratioDown = 1.0 / oldZoom;
        updateToolbarUI();
        updateAllWrapperDimensions();
        debouncedReRender();

        container.scrollLeft = 0;
        container.scrollTop = Math.max(0, Math.round(py * ratioDown - vy));
      } else {
        // Zoom in to 288% clarity anchored directly at the clicked / tapped fixed point!
        viewMode = 'custom';
        userZoom = 2.88;
        var ratioUp = 2.88 / oldZoom;
        updateToolbarUI();
        updateAllWrapperDimensions();
        debouncedReRender();

        container.scrollLeft = Math.max(0, Math.round(px * ratioUp - vx));
        container.scrollTop = Math.max(0, Math.round(py * ratioUp - vy));
      }
    }

    // Desktop & laptop mouse/trackpad double-click anywhere on the screen
    container.addEventListener('dblclick', function(e) {
      if (e.target && e.target.closest('button')) {
        return;
      }
      e.preventDefault();
      handleScreenDoubleClick(e.clientX, e.clientY);
    });

    var pinchEndedJustNow = false;

    // Mobile & tablet touch double-tap and two-finger anchored pinch-to-zoom
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 2) {
        e.preventDefault();
        isPinching = true;
        pinchEndedJustNow = false;

        var t1 = e.touches[0];
        var t2 = e.touches[1];
        initialPinchDist = getTouchesDist(t1, t2);
        if (initialPinchDist < 10) return;

        pinchStartZoom = (viewMode === 'custom') ? userZoom : 1.0;
        currentPinchScale = pinchStartZoom;

        var midX = (t1.clientX + t2.clientX) / 2;
        var midY = (t1.clientY + t2.clientY) / 2;
        pinchStartMidX = midX;
        pinchStartMidY = midY;
        pinchMidX = midX;
        pinchMidY = midY;

        var rect = container.getBoundingClientRect();
        var vx = midX - rect.left;
        var vy = midY - rect.top;

        var layerRect = zoomLayer.getBoundingClientRect();
        pinchDocPointX = midX - layerRect.left;
        pinchDocPointY = midY - layerRect.top;

        // Normalized 1.0x document anchor
        pinchDocAnchorX = pinchDocPointX / pinchStartZoom;
        pinchDocAnchorY = pinchDocPointY / pinchStartZoom;

        // Anchor the CSS transform directly at the physical touch point on the document
        zoomLayer.style.transformOrigin = pinchDocPointX + 'px ' + pinchDocPointY + 'px';
        zoomLayer.style.transform = 'none';
        zoomLayer.style.willChange = 'transform';
      } else if (e.touches.length === 1 && !isPinching && !pinchEndedJustNow) {
        var now = Date.now();
        if (now - lastTapTime < 350) {
          e.preventDefault();
          handleScreenDoubleClick(e.touches[0].clientX, e.touches[0].clientY);
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;
      }
    }, { passive: false });

    container.addEventListener('touchmove', function(e) {
      if (isPinching && e.touches.length === 2) {
        e.preventDefault();
        var t1 = e.touches[0];
        var t2 = e.touches[1];
        var currentDist = getTouchesDist(t1, t2);
        if (initialPinchDist > 0) {
          var factor = currentDist / initialPinchDist;
          currentPinchScale = Math.min(5.0, Math.max(0.85, pinchStartZoom * factor));

          var midX = (t1.clientX + t2.clientX) / 2;
          var midY = (t1.clientY + t2.clientY) / 2;
          pinchMidX = midX;
          pinchMidY = midY;

          var dx = midX - pinchStartMidX;
          var dy = midY - pinchStartMidY;
          var relScale = currentPinchScale / pinchStartZoom;

          // Smooth continuous visual scaling locked to the touch point with zero drift
          zoomLayer.style.transform = 'translate3d(' + dx + 'px, ' + dy + 'px, 0) scale(' + relScale + ')';
        }
      } else if (pinchEndedJustNow) {
        e.preventDefault();
      }
    }, { passive: false });

    container.addEventListener('touchend', function(e) {
      if (isPinching) {
        isPinching = false;
        pinchEndedJustNow = true;

        var rect = container.getBoundingClientRect();
        var vx = pinchMidX - rect.left;
        var vy = pinchMidY - rect.top;

        if (currentPinchScale <= 1.05) {
          // Snap directly to 100% Fit Width! Zero margins!
          viewMode = 'fit-width';
          userZoom = 1.0;
          updateAllWrapperDimensions();
          zoomLayer.style.transform = 'none';
          zoomLayer.style.transformOrigin = '0 0';
          zoomLayer.style.willChange = 'auto';

          container.scrollLeft = 0;
          var targetTop = Math.max(0, Math.round((pinchDocAnchorY * 1.0) - vy));
          container.scrollTop = targetTop;
          debouncedReRender();
        } else {
          // Keep PDF constant and sharp: Re-anchor document to exact ending pixel
          viewMode = 'custom';
          userZoom = Math.round(currentPinchScale * 100) / 100;
          updateAllWrapperDimensions();
          zoomLayer.style.transform = 'none';
          zoomLayer.style.transformOrigin = '0 0';
          zoomLayer.style.willChange = 'auto';

          var targetLeft = Math.max(0, Math.round((pinchDocAnchorX * userZoom) - vx));
          var targetTop = Math.max(0, Math.round((pinchDocAnchorY * userZoom) - vy));
          container.scrollLeft = targetLeft;
          container.scrollTop = targetTop;
          debouncedReRender();
        }
        initialPinchDist = 0;
      }
      if (e.touches.length === 0) {
        setTimeout(function() {
          pinchEndedJustNow = false;
        }, 120);
      }
    });

    container.addEventListener('touchcancel', function(e) {
      if (isPinching) {
        isPinching = false;
        zoomLayer.style.transform = 'none';
        zoomLayer.style.transformOrigin = '0 0';
        zoomLayer.style.willChange = 'auto';
        initialPinchDist = 0;
      }
      if (e.touches.length === 0) {
        pinchEndedJustNow = false;
      }
    });

    // Trackpad pinch / Ctrl+Wheel zoom for desktop & laptops (Mac trackpad smooth zoom anchored at cursor)
    container.addEventListener('wheel', function(e) {
      if (e.ctrlKey) {
        e.preventDefault();
        var delta = -e.deltaY * 0.008;
        var oldZoom = (viewMode === 'custom') ? userZoom : 1.0;
        var nextZoom = Math.min(5.0, Math.max(1.0, oldZoom + delta));

        var rect = container.getBoundingClientRect();
        var vx = e.clientX - rect.left;
        var vy = e.clientY - rect.top;
        var px = container.scrollLeft + vx;
        var py = container.scrollTop + vy;

        if (nextZoom <= 1.05) {
          viewMode = 'fit-width';
          userZoom = 1.0;
          updateToolbarUI();
          updateAllWrapperDimensions();
          debouncedReRender();
          container.scrollLeft = 0;
          var rDown = 1.0 / oldZoom;
          container.scrollTop = Math.max(0, Math.round(py * rDown - vy));
        } else {
          viewMode = 'custom';
          userZoom = Math.round(nextZoom * 100) / 100;
          var rUp = userZoom / oldZoom;
          updateToolbarUI();
          updateAllWrapperDimensions();
          debouncedReRender();
          container.scrollLeft = Math.max(0, Math.round(px * rUp - vx));
          container.scrollTop = Math.max(0, Math.round(py * rUp - vy));
        }
      }
    }, { passive: false });

    // =========================================================================
    // 5. MOBILE BACK BUTTON & GESTURE COMMANDS
    // =========================================================================
    function triggerMobileBack() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage('EPS_READER_BACK', '*');
        }
      } catch (err) {}
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' || e.key === 'Backspace') {
        triggerMobileBack();
      }
    });

    window.addEventListener('popstate', function() {
      triggerMobileBack();
    });

    var edgeStartX = 0;
    var edgeStartY = 0;
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        edgeStartX = e.touches[0].clientX;
        edgeStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
      if (e.changedTouches.length === 1 && edgeStartX < 40 && userZoom <= 1.05) {
        var dx = e.changedTouches[0].clientX - edgeStartX;
        var dy = Math.abs(e.changedTouches[0].clientY - edgeStartY);
        if (dx > 80 && dy < 60) {
          triggerMobileBack();
        }
      }
    }, { passive: true });

    // =========================================================================
    // 6. MAIN DOCUMENT INITIALIZATION & VIRTUALIZATION
    // =========================================================================
    async function startRenderingDoc(pdfSource) {
      var baseOrigin = (window.location && window.location.origin && window.location.origin.startsWith('http') && !window.location.origin.includes('localhost'))
        ? window.location.origin : 'https://examjk.com';

      var loadingParams = {
        cMapUrl: baseOrigin + '/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: baseOrigin + '/standard_fonts/',
        disableFontFace: false,
        isEvalSupported: true,
        useSystemFonts: false
      };

      if (typeof pdfSource === 'string') {
        loadingParams.url = pdfSource;
      } else {
        var dataArray = pdfSource instanceof Uint8Array ? pdfSource : new Uint8Array(pdfSource);
        loadingParams.data = dataArray;
      }

      var loadingTask = pdfjsLib.getDocument(loadingParams);
      pdfDoc = await loadingTask.promise;
      var totalPages = pdfDoc.numPages;

      // Page 1 placeholder
      var wrap1 = document.createElement('div');
      wrap1.className = 'pdf-page-wrapper';
      wrap1.id = 'page-wrapper-1';
      wrap1.setAttribute('data-page-num', '1');
      zoomLayer.appendChild(wrap1);

      try {
        await renderPage(1, wrap1);
      } catch (e1) {
        console.warn('Page 1 render warning:', e1);
      }

      // Hide loading spinner in milliseconds!
      if (loadingView) loadingView.style.display = 'none';
      if (offlineBadge) offlineBadge.style.display = 'inline-block';
      updateToolbarUI();
      updateAllWrapperDimensions();

      // Create placeholders for remaining pages
      for (var i = 2; i <= totalPages; i++) {
        var wrapper = document.createElement('div');
        wrapper.className = 'pdf-page-wrapper';
        wrapper.id = 'page-wrapper-' + i;
        wrapper.setAttribute('data-page-num', String(i));
        zoomLayer.appendChild(wrapper);
      }
      updateAllWrapperDimensions();

      if (totalPages >= 2) {
        var initialWrap2 = document.getElementById('page-wrapper-2');
        if (initialWrap2) renderPage(2, initialWrap2).catch(function() {});
      }

      // IntersectionObserver for lazy page rendering and 1GB RAM memory virtualization
      if ('IntersectionObserver' in window) {
        var isLowMem = (typeof navigator !== 'undefined' && navigator.deviceMemory && navigator.deviceMemory <= 2);
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            var pageNum = parseInt(entry.target.getAttribute('data-page-num'), 10);
            if (entry.isIntersecting) {
              if (!renderedPages.has(pageNum)) {
                renderPage(pageNum, entry.target);
              }
            } else if (isLowMem && Math.abs(pageNum - (renderedPages.values().next().value || 1)) > 2) {
              // Unrender off-screen pages to prevent OOM tab terminations on 1GB RAM Android devices
              unrenderPage(pageNum, entry.target);
            }
          });
        }, {
          root: container,
          rootMargin: '600px 0px 600px 0px'
        });

        for (var k = 1; k <= totalPages; k++) {
          var wrapEl = document.getElementById('page-wrapper-' + k);
          if (wrapEl) observer.observe(wrapEl);
        }
      }

      function checkVisiblePages() {
        for (var p = 1; p <= totalPages; p++) {
          if (!renderedPages.has(p)) {
            var el = document.getElementById('page-wrapper-' + p);
            if (el) {
              var rect = el.getBoundingClientRect();
              if (rect.top < window.innerHeight + 800 && rect.bottom > -800) {
                renderPage(p, el);
              }
            }
          }
        }
      }

      var scrollTimer = null;
      container.addEventListener('scroll', function() {
        if (scrollTimer) return;
        scrollTimer = setTimeout(function() {
          scrollTimer = null;
          checkVisiblePages();
        }, 120);
      }, { passive: true });

      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          updateToolbarUI();
          debouncedReRender();
        }, 200);
      });

      setTimeout(checkVisiblePages, 50);
      setTimeout(checkVisiblePages, 500);
    }

    async function initViewer() {
      var targetDocUrl = sanitizeUrl(cleanUrl);
      var absUrl = toAbsoluteUrl(targetDocUrl);

      // Fast Path 1: Check in-memory cache & persistent offline storage (0ms instant!)
      try {
        var cachedBuffer = await loadCachedPdfBuffer(targetDocUrl);
        if (cachedBuffer && (cachedBuffer.byteLength > 1000 || (cachedBuffer.buffer && cachedBuffer.buffer.byteLength > 1000))) {
          if (offlineBadge) offlineBadge.style.display = 'inline-block';
          await startRenderingDoc(cachedBuffer);
          return;
        }
      } catch (cacheErr) {
        console.warn('Cache lookup notice:', cacheErr);
      }

      // Fast Path 2: Fetch and render via ArrayBuffer (universal support across all web servers & browsers)
      try {
        var fallbackBuffer = await downloadPdfWithProgress(targetDocUrl, function(pct) {
          if (loadingProgress) loadingProgress.textContent = 'Opening Document (' + pct + '%)...';
        });
        if (fallbackBuffer && (fallbackBuffer.byteLength > 1000 || (fallbackBuffer.buffer && fallbackBuffer.buffer.byteLength > 1000))) {
          await startRenderingDoc(fallbackBuffer);

          // Save to IndexedDB & CacheStorage in background for lifetime 0ms offline access
          try {
            var db = await openOfflineDb();
            var pdfBlob = new Blob([fallbackBuffer], { type: 'application/pdf' });
            saveToDb(db, targetDocUrl, pdfBlob);
            saveToCacheStorage(targetDocUrl, pdfBlob);
            var pCache = (window.parent && window.parent !== window && window.parent.__SIGMA_BUFFER_CACHE__)
              ? window.parent.__SIGMA_BUFFER_CACHE__ : (window.__SIGMA_BUFFER_CACHE__ || null);
            if (pCache) pCache.set(targetDocUrl, fallbackBuffer);
          } catch (saveErr) {}
          return;
        }
      } catch (downloadErr) {
        console.warn('Buffer download notice, trying direct URL:', downloadErr);
      }

      // Fast Path 3: Direct URL streaming fallback
      try {
        await startRenderingDoc(absUrl);
      } catch (streamErr) {
        console.error('Final PDF rendering failure:', streamErr);
        showError('Unable to load document. Please check your internet connection and tap Retry.');
      }
    }

    initViewer();
  })();
</script>
